e continually confirms","meaning":"A golden principle: Sound practical judgment is rarer than conventional academic degrees.","categoryName":"Wisdom & Knowledge","tags":["Wisdom & Knowledge","Adage","Wisdom"]},"tamil":{"proverb":"அறியாமை அனைத்துத் தீமைக்கும் தாய் - அனுபவமே இதை மீண்டும் மீண்டும் மெய்ப்பிக்கிறது","meaning":"பொன்மொழி விளக்கம்: தெளிவற்ற அறியாமையே மனித வாழ்வில் ஏற்படும் அத்தனை துன்பங்களுக்கும் வித்தாகிறது.","categoryName":"ஞானமும் விவேகமும்","tags":["ஞானமும் விவேகமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"විමසීම ප්‍රඥාවේ ආරම්භයයි - අත්දැකීමෙන් සනාථ වූ සදාකාලික සත්‍යයකි","meaning":"උතුම් උපදේශය: සෑම දෙයක්ම අන්ධ ලෙස නොපිළිගෙන ප්‍රශ්න කර සත්‍යය සොයායාම නියම බුද්ධියේ ආරම්භයයි.","categoryName":"ප්‍රඥාව සහ නුවණ","tags":["ප්‍රඥාව සහ නුවණ","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":53,"category":"wisdom","english":{"proverb":"A wise person listens twice as much as they speak, which remains true across generations","meaning":"A golden principle: Wisdom is acquired through attentive observation and contemplation rather than incessant chatter.","categoryName":"Wisdom & Knowledge","tags":["Wisdom & Knowledge","Adage","Wisdom"]},"tamil":{"proverb":"முதியோர் சொல் அமிர்தம் - சான்றோர்கள் போற்றிய நற்பாதையாகும்","meaning":"பொன்மொழி விளக்கம்: வாழ்ந்து கனிந்த பெரியவர்களின் அறிவுரைகள் வாழ்வின் இக்கட்டான பாதைகளில் அமுதமாய் வழிகாட்டும்.","categoryName":"ஞானமும் விவேகமும்","tags":["ஞானமும் விவேகமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණැත්තා සවන්දීමට වැඩි කැමැත්තක් දක්වයි - පරපුරෙන් පරපුරට රැකගත් වටිනා අවවාදයකි","meaning":"උතුම් උපදේශය: නිතරම තමන් කතා කරනවාට වඩා අන් අයට සවන් දීමෙන් නව දැනුම එක්රැස් කරගත හැකිය.","categoryName":"ප්‍රඥාව සහ නුවණ","tags":["ප්‍රඥාව සහ නුවණ","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":54,"category":"wisdom","english":{"proverb":"He who asks is a fool for five minutes, but he who does not ask remains a fool forever, a timeless truth of life","meaning":"A golden principle: Humility in seeking guidance dispels lifelong ignorance.","categ :"තීරණාත්මක මොහොතකදී: උගත්කම කාටවත් සොරාගත නොහැකි ධනයකි","meaning":"නියම ඥානය සහ ශිල්පය ජීවිත කාලය පුරාම පුද්ගලයාට ආරක්ෂාව සලසන උතුම්ම වස්තුවයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ප්‍රඥාව සහ නුවණ","tags":["ප්‍රඥාව සහ නුවණ","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":63,"category":"wisdom","english":{"proverb":"Heed the adage: A wise man changes his mind, a fool never","meaning":"True intelligence lies in the willingness to acknowledge new truths and adapt thoughtfully. Cultivating this understanding brings harmony and resilience.","categoryName":"Wisdom & Knowledge","tags":["Wisdom & Knowledge","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: இளமையில் கல்","meaning":"வாழ்க்கையின் தொடக்கப் பருவத்திலேயே கல்வி மற்றும் நற்பழக்கங்களைக் கற்றுக்கொள்வதே சிறந்த எதிர்காலத்தை அமைக்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"ஞானமும் விவேகமும்","tags":["ஞானமும் விவேகமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: නුවණැත්තා අනුන්ගේ වරදින්ද පාඩම් ඉගෙන ගනී","meaning":"බුද්ධිමත් පුද්ගලයා තමන්ගේ වැරදිවලින් පමණක් නොව අනුන්ගේ අත්දැකීම්වලින්ද ජීවිතය නිවැරදි කරගනී. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ප්‍රඥාව සහ නුවණ","tags":["ප්‍රඥාව සහ නුවණ","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":64,"category":"wisdom","english":{"proverb":"A golden rule: Experience is the mother of wisdom","meaning":"Theoretical understanding is enriched and solidified only through navigating real-world tests. Cultivating this understanding brings harmony and resilience.","categoryName":"Wisdom & Knowledge","tags":["Wisdom & Knowledge","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: தொட்டில் பழக்கம் சுடுகாடு மட்டும்","meaning":"சிறுவயதில் உள்ளத்தில் பதியும் ஒழுக்கமும் பழக்கவழக்கங்களும் வாழ்நாளின் இறுதிவரை நீடித்திருக்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"ஞானமும் விவேகமு ்சியும் உழைப்பும்","tags":["முயற்சியும் உழைப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: නොනවතින ගමන ඉලක්කය කරා ගෙන යයි","meaning":"වේගය අඩු වුවද අඛණ්ඩව ඉදිරියටම ඇදෙන තැනැත්තා අවසානයේදී ජයග්‍රාහී කණුව ස්පර්ශ කරයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"උත්සාහය සහ කැපවීම","tags":["උත්සාහය සහ කැපවීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":176,"category":"effort","english":{"proverb":"Remember well: Step by step the ladder is ascended","meaning":"Great summits are reached through humble, consistent, incremental progress. Cultivating this understanding brings harmony and resilience.","categoryName":"Hard Work & Perseverance","tags":["Hard Work & Perseverance","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: பயிற்சி மனிதனைப் பரிபூரணனாக்கும்","meaning":"மீண்டும் மீண்டும் செய்யப்படும் நேர்மையான முயற்சியால் பிழைகள் நீங்கி முழுமை கைகூடும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"முயற்சியும் உழைப்பும்","tags":["முயற்சியும் உழைப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: අභියෝග හමුවේ නොසැලෙන්න","meaning":"පැමිණෙන බාධක තමා පරීක්ෂා කරන උරගල් ලෙස සලකා නොබියව ඉදිරියට යාම වීරයන්ගේ ලක්ෂණයයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"උත්සාහය සහ කැපවීම","tags":["උත්සාහය සහ කැපවීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":177,"category":"effort","english":{"proverb":"In moments of decision: Genius is one percent inspiration and ninety-nine percent perspiration","meaning":"Breakthrough success stems primarily from relentless sweat and industrious effort. Cultivating this understanding brings harmony and resilience.","categoryName":"Hard Work & Perseverance","tags":["Hard Work & Perseverance","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: உயர்வு தரும் உழைப்பு","meaning":"தன்னலமற்ற தூய உழைப்பு ஒரு மனிதனைச் சமூகத்தில் என்றும் மதிக்கத்தக்க சிகரத்தில் அமர்த்தும். inciple: Superficial praise appeals primarily to those devoid of self-awareness and inner substance.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"நல்ல சொல் நண்பனை உண்டாக்கும் - தலைமுறைகள் கடந்த நல்விளக்கமாகும்","meaning":"பொன்மொழி விளக்கம்: பண்பான சொற்கள் விரோதியையும் நண்பனாக்கும்; நச்சுச் சொற்கள் நண்பனையும் பகைவனாக்கும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"කේලම් කියන්නා විශ්වාස නොකරන්න - ජීවිතයේ යථාර්ථය පෙන්වාදෙන කැඩපතකි","meaning":"උතුම් උපදේශය: අනුන්ගේ වැරදි ඔබ ඉදිරියේ කියවන තැනැත්තා ඔබේ රහස්ද අනුන් ඉදිරියේ හෙළිකරයි.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":251,"category":"speech","english":{"proverb":"A liar is not believed even when he speaks the truth, for actions mirror character","meaning":"A golden principle: Chronic deceit completely dismantles personal trustworthiness, even in moments of sincerity.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"சான்றோர் சொல் வீண் போகாது - இது காலத்தால் அழியாத வாழ்வியல் உண்மை","meaning":"பொன்மொழி விளக்கம்: அறிவுசால் பெரியவர்கள் சொல்லும் எச்சரிக்கைகளும் வழிகாட்டல்களும் ஒருபோதும் வீணாகிப் போவதில்லை.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"වචනයෙන් කරන තුවාලය සුවපත් නොවේ - මෙය කාලාන්තරයක් තිස්සේ සත්‍යය වූ ධර්මතාවයකි","meaning":"උතුම් උපදේශය: ශාරීරික තුවාල සුව වුවද නපුරු වචනවලින් සිතට කරන හානිය ජීවිත කාලය පුරාම රිදුම් දෙයි.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":252,"category":"speech","english":{"proverb":"Better to be slapped with the truth than kissed with a lie, as experience continually confirms","meaning":"A golden principle: Painful reality is incomparably healthier than comforting falsehoods.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage" ter value than abundant words. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: தீயினால் சுட்டபுண் உள்ளாறும் ஆறாதே நாவினால் சுட்ட வடு","meaning":"தீயினால் ஏற்படும் காயம் காலப்போக்கில் ஆறிவிடும்; ஆனால் நாவினால் சுடும் கொடுஞ்சொற்கள் ஒருபோதும் மறையாது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: කට පරිස්සම් කරගන්නා හිස රැකගනී","meaning":"තමාගේ වචන පාලනය කරගෙන ප්‍රවේශමෙන් කතා කරන පුද්ගලයා අනවශ්‍ය විපත් හා කරදරවලින් ආරක්ෂා වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":262,"category":"speech","english":{"proverb":"In moments of decision: A slip of the foot you may soon recover, but a slip of the tongue you may never get over","meaning":"Physical wounds heal naturally, while cruel or careless utterances inflict irreversible damage. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: வாய்மையே வெல்லும்","meaning":"எத்தனை பொய்களும் சூழ்ச்சிகளும் மறைத்தாலும் முடிவில் தூய வாய்மையே என்றென்றும் நிலைத்து நிற்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: සත්‍යය කවදා හෝ ජයගනී","meaning":"කොතෙක් වසන් කළද අවසානයේදී සත්‍යයම සමාජය ඉදිරියේ ජයග්‍රාහීව බබළයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":263,"category":"speech","english":{"proverb":"Heed the adage: The ouder than words","meaning":"What a person consistently does reveals their real character far more accurately than empty promises. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: அளந்து பேசு","meaning":"பொருளற்ற பேச்சுகளைத் தவிர்த்து, சூழலுக்கு ஏற்ப தேவையானதை மட்டும் அளவோடு பேசுவது விவேகம். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: ක්‍රියාව වචනයට වඩා හඬ නගයි","meaning":"මිනිසෙකුගේ නියම වටිනාකම තීරණය වන්නේ ඔහු කරන පුරසාරම් වලින් නොව සැබෑ ක්‍රියාවලිනි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":266,"category":"speech","english":{"proverb":"Remember well: A gentle answer turns away wrath","meaning":"Kind and moderate rejoinders de-escalate fiery confrontation and disarm hostility. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: இனிய உளவாக இன்னாத கூறல் கனிஇருப்பக் காய்கவர்ந் தற்று","meaning":"இனிய சொற்கள் இருக்கும்போது கடுமையான சொற்களைப் பேசுவது, கனியை விட்டு கசப்பான காயைத் தின்பதற்கு ஒப்பாகும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: මිහිරි වදන සතුරන් මිතුරන් කරයි","meaning":"කරුණාවෙන් පිරි ප්‍රිය වචනයක් කතා කිරීමෙන් වෛරී සිත් පවා සන්සුන් කරගත හැක. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":267,"category":"speech","english":{"proverb":"In moments of decision: Think before you speak","meaning":"Reflecting on potential consequences prevents profound remorse caused by reckless speech. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: மெளனம் பல பிழைகளைத் தடுக்கும்","meaning":"தேவையற்ற விவாதங்களிலும் வீண் தர்க்கங்களிலும் விவேகமான அமைதியே பல சங்கடங்களைத் தவிர்க்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: බොරු කියන්නාට කවුරුත් විශ්වාස නැත","meaning":"නිතර නිතර බොරු පවසන මිනිසා ඇත්තක් පැවසුවද සමාජය ඔහුව විශ්වාස නොකරයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":268,"category":"speech","english":{"proverb":"Heed the adage: Half a truth is often a whole lie","meaning":"Deliberately withholding crucial facts distorts reality just as malevolently as an outright falsehood. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: பொய் சொன்ன வாய்க்கு போஜனம் கிடைக்காது","meaning":"தொடர்ந்து பொய் பேசி பிறரை ஏமாற்றுபவன் இறுதியில் அனைவரின் நம்பிக்கையையும் இழந்து அனாதையாவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: සිතා බලා කතා කරන්න","meaning":"තමා පවසන වචනයෙන් අනුන්ගේ සිත් රිදේද නැද්ද යන්න කලින්ම සිතා කතා කිරීම වැදගත්ය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":269,"category":"speech","english":{"proverb":"A golden rule: Least said, soonest mended","meaning":"Restraint in verbal retaliation leaves fewer grievances to apologize for and heal. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: உண்மை எப்போதும் கசக்கும்","meaning":"நேர்மையான உண்மையை எடுத்துரைக்கும்போது அது பலருக்கு ஆரம்பத்தில் கசப்பாகத் தோன்றினாலும் நன்மையே தரும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: ඇත්ත තිත්ත වුවද යහපත සලසයි","meaning":"සත්‍යය මුලදී කටුක ලෙස දැනුණද අවසානයේදී එයින් යහපත හා විමුක්තිය උදාවේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":270,"category":"speech","english":{"proverb":"Keep in mind that Flattery is the food of fools","meaning":"Superficial praise appeals primarily to those devoid of self-awareness and inner substance. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: நல்ல சொல் நண்பனை உண்டாக்கும்","meaning":"பண்பான சொற்கள் விரோதியையும் நண்பனாக்கும்; நச்சுச் சொற்கள் நண்பனையும் பகைவனாக்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: කේලම් කියන්නා විශ්වාස නොකරන්න","meaning":"අනුන්ගේ වැරදි ඔබ ඉදිරියේ කියවන තැනැත්තා ඔබේ රහස්ද අනුන් ඉදිරියේ හෙළිකරයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":271,"category":"speech","english":{"proverb":"Remember well: A liar is not believed even when he speaks the truth","meaning":"Chronic deceit completely dismantles personal trustworthiness, even in moments of sincerity. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: சான்றோர் சொல் வீண் போகாது","meaning":"அறிவுசால் பெரியவர்கள் சொல்லும் எச்சரிக்கைகளும் வழிகாட்டல்களும் ஒருபோதும் வீணாகிப் போவதில்லை. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: වචනයෙන් කරන තුවාලය සුවපත් නොවේ","meaning":"ශාරීරික තුවාල සුව වුවද නපුරු වචනවලින් සිතට කරන හානිය ජීවිත කාලය පුරාම රිදුම් දෙයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":272,"category":"speech","english":{"proverb":"In moments of decision: Better to be slapped with the truth than kissed with a lie","meaning":"Painful reality is incomparably healthier than comforting falsehoods. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: எண்ணித் துணிக சொல்","meaning":"பேசுவதற்கு முன் அச்சொல் பிறர் மனதை எவ்வாறு பாதிக்கும் என்பதை விவேகத்துடன் சிந்தித்து பேச வேண்டும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: නිරහංකාර කතාව ගෞරවය ගෙනදෙයි","meaning":"පුරසාරම් හා උඩඟුකමින් තොර නිහතමානී වචන සමාජයේ පිළිගැනීම වැඩිකරයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":273,"category":"speech","english":{"proverb":"Heed the adage: A good tongue is a good weapon","meaning":"Courteous, eloquent, and measured speech protects its speaker in hazardous encounters. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: புகழ்ச்சிக்கு மயங்காதே","meaning":"நோக்கமில்லாத வீண் புகழுரைகளில் மயங்கித் தன் சுயமதிப்பீட்டை இழப்பவன் எளிதில் சறுக்கி விழுவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: අනුන්ට නින්දා නොකරන්න","meaning":"අන්‍යයන්ගේ අඩුපාඩු හෙළා දකිමින් කතා කිරීමෙන් තමාගේම පහත්කම ප්‍රදර්ශනය වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":274,"category":"speech","english":{"proverb":"A golden rule: Speak the truth and shame the devil","meaning":"Unyielding honesty shatters deceitful plots and establishes moral supremacy. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: உள்ளொன்று வைத்துப் புறமொன்று பேசேல்","meaning":"மனதில் ஒரு கெட்ட எண்ணத்தை வைத்துக்கொண்டு உதட்டளவில் நயமாகப் பேசுவது மாபெரும் துரோகம். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: කතා කළ යුත්තේ කාලෝචිතවය","meaning":"ඕනෑම සත්‍යයක් වුවද පැවසිය යුත්තේ සුදුසු වේලාව හා ස්ථානය නිවැරදිව තෝරාගැනීමෙනි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":275,"category":"speech","english":{"proverb":"Keep in mind that A closed mouth catches no flies","meaning":"Prudent silence keeps a person sheltered from unnecessary gossip and perilous entanglements. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: மெய்ப்பொருள் காண்பது அறிவு","meaning":"யார் பேசினாலும் அவர்கள் சொல்லும் வார்த்தைகளின் உள்நோக்கத்தையும் உண்மையையும் அறிவதே சிறந்த அறிவு. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: පොරොන්දු ඉටුකිරීම උතුම් ගුණයකි","meaning":"දුන් පොරොන්දුවක් ජීවිතය මෙන් රැකගැනීම විශ්වාසවන්ත පුද්ගලයෙකුගේ ලක්ෂණයයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":276,"category":"speech","english":{"proverb":"Remember well: Words once spoken cannot be recalled","meaning":"Like an arrow released from the bow, spoken words can never be drawn back into silence. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: நாவடக்கம் உயிரைக் காக்கும்","meaning":"தன் நாவை அடக்கிப் பேசத் தெரிந்தவன் வாழ்வில் பெரும் வம்புகளிலிருந்தும் விபத்துகளிலிருந்தும் தப்புவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: ප්‍රශංසාවට නොරැවටෙන්න","meaning":"තමන්ව මුලා කිරීමට කරන ව්‍යාජ ප්‍රශංසාවලට අසු නොවී තමන්ගේ යථාර්ථය හඳුනාගත යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":277,"category":"speech","english":{"proverb":"In moments of decision: Truth hurts, but lies kill","meaning":"While genuine candor may cause transient sting, habitual dishonesty destroys relationships and souls. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: வாய்மை என்பது பிறர்க்குத் தீங்கு தராத சொல்","meaning":"எந்த உயிருக்கும் சிறு துன்பமும் தராத தூய நன்மையை விளைவிக்கும் சொற்களே உண்மையான வாய்மை. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: නොදන්නා දෙයට නිහඬවීම යහපත්ය","meaning":"යම් කරුණක් පිළිබඳව නිසි අවබෝධයක් නැතිවිට ඒ ගැන නොදොඩා සිටීම බුද්ධිමත්ය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":278,"category":"speech","english":{"proverb":"Heed the adage: Empty promises are like painted fruit","meaning":"Elaborate commitments backed by zero execution satisfy no hunger and build no future. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: இனிமையான பதில் கோபத்தைத் தணிக்கும்","meaning":"எதிராளியின் ஆத்திரமான சூழலிலும் அமைதியான கனிவான பதில் பெரும் கலவரத்தை அடக்கிவிடும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: සත්‍යවාදී මිනිසාට බියක් නැත","meaning":"සැමවිටම සත්‍යයම කතා කරන පුද්ගලයාට කිසිවෙකු ඉදිරියෙහි ලැජ්ජා වීමට හෝ බියවීමට කරුණක් නැත. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":279,"category":"speech","english":{"proverb":"A golden rule: Discretion of speech is more than eloquence","meaning":"Exercising prudent judgment regarding what to voice surpasses mere rhetorical elegance. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: சொல் வேறு செயல் வேறு ஆகாது","meaning":"சொல்வதைச் செய்வதும் செய்வதையே சொல்வதும் ஒரு உன்னத மனிதனின் தலையாய பண்பாகும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: කේන්තියෙන් කතා නොකරන්න","meaning":"තරහව පාලනය කරගත නොහැකි මොහොතක පවසන වචන ජීවිත කාලය පුරාම පසුතැවීමට මගපාදයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":280,"category":"speech","english":{"proverb":"Keep in mind that He who gossips to you will gossip about you","meaning":"Those who readily traffic in secrets of others will invariably betray your confidence as well. Cultivating this understanding brings harmony and resilience.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: புறம்பேசும் நாக்கு நஞ்சாகும்","meaning":"பிறர் இல்லாத இடத்தில் அவர்களைப் பற்றிக் கோள்மூட்டுவது சொந்த மரியாதையையே அழித்துவிடும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: සැබෑ ධර්මය නිවැරදි වචනයයි","meaning":"අවංක, නිවැරදි හා අනුන්ට ප්‍රයෝජනවත් වන දේ පමණක් කතා කිරීම ශ්‍රේෂ්ඨ පුරුද්දකි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කථාව සහ සත්‍යය" peech","english":{"proverb":"Sage Counsel: The truth will set you free","meaning":"Essential insight for all seekers: Living in transparent honesty unburdens the spirit from guilt, anxiety, and duplicity.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"அறவழிக் கருத்து: சொல்லில் இனிமை வேண்டும்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: பிறரிடம் பேசும் சொற்களில் அன்பும் கனிவும் மரியாதையும் இருப்பது நல்லுறவை வளர்க்கும்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"ජනශ්‍රැති ප්‍රඥාව: කී වචනය ආපසු ගත නොහැක","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: දුන්නෙන් මිදුණු ඊතලය මෙන් මුවින් පිටවූ වචනයද කිසිදා ආපසු හැරවිය නොහැකිය.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":284,"category":"speech","english":{"proverb":"Folk Wisdom: Honesty is the best policy","meaning":"Essential insight for all seekers: Transparent integrity preserves moral standing, peaceful sleep, and enduring credibility.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"மரபுச் செல்வம்: வார்த்தையை விட்டால் அள்ள முடியாது","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: வில்லில் இருந்து புறப்பட்ட அம்பைப் போல, நாவிலிருந்து வெளிவந்த சொற்களை ஒருபோதும் திரும்பப் பெற முடியாது.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"උතුම් ජීවන මග: නිහඬ බව රත්තරන් හා සමානයි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: අවශ්‍ය නොවන තැන්වලදී අනවශ්‍ය ලෙස වාද විවාද නොකර නිහඬව සිටීම උතුම් ප්‍රඥාවකි.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":285,"category":"speech","english":{"proverb":"Heritage Teaching: Actions speak louder than words","meaning":"Essential insight for all seekers: What a person consistently does reveals their real character far more accurately than e truth and shame the devil","meaning":"Essential insight for all seekers: Unyielding honesty shatters deceitful plots and establishes moral supremacy.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"மரபுச் செல்வம்: உள்ளொன்று வைத்துப் புறமொன்று பேசேல்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: மனதில் ஒரு கெட்ட எண்ணத்தை வைத்துக்கொண்டு உதட்டளவில் நயமாகப் பேசுவது மாபெரும் துரோகம்.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"උතුම් ජීවන මග: කතා කළ යුත්තේ කාලෝචිතවය","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: ඕනෑම සත්‍යයක් වුවද පැවසිය යුත්තේ සුදුසු වේලාව හා ස්ථානය නිවැරදිව තෝරාගැනීමෙනි.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":295,"category":"speech","english":{"proverb":"Heritage Teaching: A closed mouth catches no flies","meaning":"Essential insight for all seekers: Prudent silence keeps a person sheltered from unnecessary gossip and perilous entanglements.","categoryName":"Speech & Truth","tags":["Speech & Truth","Adage","Wisdom"]},"tamil":{"proverb":"அனுபவப் பாடம்: மெய்ப்பொருள் காண்பது அறிவு","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: யார் பேசினாலும் அவர்கள் சொல்லும் வார்த்தைகளின் உள்நோக்கத்தையும் உண்மையையும் அறிவதே சிறந்த அறிவு.","categoryName":"சொல்லும் வாய்மையும்","tags":["சொல்லும் வாய்மையும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"සදාචාර නීතිය: පොරොන්දු ඉටුකිරීම උතුම් ගුණයකි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: දුන් පොරොන්දුවක් ජීවිතය මෙන් රැකගැනීම විශ්වාසවන්ත පුද්ගලයෙකුගේ ලක්ෂණයයි.","categoryName":"කථාව සහ සත්‍යය","tags":["කථාව සහ සත්‍යය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":296,"category":"speech","english":{"proverb":"Universal Adage: Words once spoken cannot be recalled","meaning":"Essential insight for all seekers: Like an arrow released from the bow, spoken words can never be drawn back into silence.","categoryName":"Speech & Truth tegory":"caution","english":{"proverb":"In moments of decision: A stitch in time saves nine","meaning":"Timely prompt repair of a small flaw prevents massive breakdown and exorbitant repair. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: வருமுன் காப்பதே அறிவு","meaning":"துன்பமும் பேரழிவும் வந்தபின் தவிப்பதை விட, அது வரும் முன்பே எச்சரிக்கையுடன் தற்காத்துக் கொள்வதே மேலானது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: නොදන්නා මුහුදේ පනින්න එපා","meaning":"ගැඹුර හෝ අවදානම නොදන්නා කිසිදු අලුත් කටයුත්තකට නොසැලකිලිමත් ලෙස අත නොතැබිය යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":363,"category":"caution","english":{"proverb":"Heed the adage: Better safe than sorry","meaning":"Exercising vigilant caution beforehand eliminates agonizing sorrow and irreversible regret. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: கெட்டிக்காரன் புளுகு எட்டு நாளையில் தெரியும்","meaning":"எவ்வளவு தந்திரமாகப் பொய் கூறி ஏமாற்றினாலும் சில நாட்களிலேயே உண்மை வெளிப்பட்டுவிடும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: දිලිසෙන සියල්ල රත්තරන් නොවේ","meaning":"බාහිර පෙනුමෙන් ආකර්ෂණීය වන සෑම දෙයක්ම ඇතුළාන්තයෙන් වටිනා හෝ සත්‍ය දේ නොවේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":364,"category":"caution","english":{"proverb":"A golden rule: Don't put all your eggs in one basket","meaning":"Distribute your valuable investments and resources rather than staking everything on a single vulnerability. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: மின்னுவதெல்லாம் பொன்னல்ல","meaning":"வெளிப்பார்வைக்கு பளபளப்பாகத் தோன்றும் அனைத்தும் உண்மையான தூய மதிப்புடையவை அல்ல. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: ගහෙන් වැටුණු මිනිහාට ගොනා ඇන්නා වගේ","meaning":"එක් විපතකින් බේරීමට තැත්කරද්දී ඊටත් වඩා විශාල මහා විපතකට මුහුණදීමට සිදුවීම. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":365,"category":"caution","english":{"proverb":"Keep in mind that Discretion is the better part of valor","meaning":"Knowing when to tactically retreat or de-escalate shows far greater intelligence than reckless bravado. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: குரைக்கின்ற நாய் கடிக்காது","meaning":"வீண் ஆர்ப்பாட்டமும் மிரட்டலும் விடுபவர்கள் உண்மையில் பெரிய ஆபத்தை விளைவிக்க மாட்டார்கள். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: ඉඟුරු දී මිරිස් ගත්තා වගේ","meaning":"පවතින කරදරයකින් මිදීමට ගොස් ඊටත් වඩා දරුණු කරදරයක් ළඟා කරගැනීම. මෙම අව ්න ඕනෙ නෑ","meaning":"නරක ගතිගුණ සහ උපද්‍රව ඇති අය තමන්ගේ නපුරුකම් ඉබේම ප්‍රදර්ශනය කරති. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":370,"category":"caution","english":{"proverb":"Keep in mind that Don't count your chickens before they are hatched","meaning":"Avoid presuming uncertain future outcomes as guaranteed realities until they actually materialize. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: பாம்பின் கால் பாம்பறியும்","meaning":"ஒரு கொடியவனின் அல்லது தந்திரக்காரனின் மறைமுகத் திட்டங்களை அதே போன்ற எண்ணம் கொண்டவனே அறிவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: මුලදීම වරද හඳුනාගන්න","meaning":"කුඩා පැළයක් ලෙස ඇතිවිටම නරක පුරුදු හෝ පාඩු කපා නොදැමුවහොත් පසුව විශාල ව්‍යසනයක් වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":371,"category":"caution","english":{"proverb":"Remember well: The burnt child dreads the fire","meaning":"A person who has suffered painful misfortune develops heightened, instinctual caution. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: சூடுபட்ட பூனை அடுப்பங்கரையை நாடாது","meaning":"ஒரு முறை ஆபத்தைச் சந்தித்தவர் மீண்டும் அந்த அபாயகரமான சூழலுக்குள் செல்ல அஞ்சுவார். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: අනතුරට පෙර සූදානම උතුම්ය","meaning":"කරදරයක් සිදුවීමට පෙර ඒ සඳහා අවශ්‍ය ප්‍රතිචාර කලින්ම සූදානම් කර තබාගැනීම නුවණයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":372,"category":"caution","english":{"proverb":"In moments of decision: Out of the frying pan into the fire","meaning":"Escaping one difficult dilemma only to land in a vastly worse crisis. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: அகல உழுவதை விட ஆழ உழுவதே மேல்","meaning":"பல வேலைகளில் கவனத்தைச் சிதறவிடுவதை விட, ஒரு வேலையில் விழிப்போடு ஆழ்ந்து கவனம் செலுத்துவது வெற்றி தரும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: අනුන්ගේ රැවටිලිවලට අසුනොවන්න","meaning":"පිටතින් පෙන්වන බොරු හිතවත්කම්වලට නොරැවටී මිනිසුන්ගේ සැබෑ ස්වභාවය විමසිල්ලෙන් බැලිය යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":373,"category":"caution","english":{"proverb":"Heed the adage: Barking dogs seldom bite","meaning":"Those who rely on blustering threats and aggressive posturing rarely possess real menace. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: வேலியே பயிரை மேய்ந்தது போல","meaning":"பாதுகாப்பாக இருக்க வேண்டியவர்களே நம்பிக்கை துரோகம் செய்து அழிவை உண்டாக்குவது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: විමසිලිමත් බව ජීවිතය රකී","meaning":"ගමනේදී හෝ තීරණ ගැනීමේදී මනා සිහියෙන් හා සෝදිසියෙන් සිටීම කරදර දුරුකරයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":374,"category":"caution","english":{"proverb":"A golden rule: Don't cross the bridge until you come to it","meaning":"Avoid exhausting energy over potential future problems that may never come to pass. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: மதில் மேல் பூனை போல இருக்காதே","meaning":"எந்தப் பக்கம் சாய்வது என்று தெரியாமல் முடிவெடுக்கத் தயங்கி விழிப்பற்ற நிலையில் இருக்கக் கூடாது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"எச்சரிக்கையும் விழிப்பும்","tags":["எச்சரிக்கையும் விழிப்பும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: ආරක්ෂාව පළමුව සලසන්න","meaning":"ඕනෑම නිර්භීත ක්‍රියාවකට වඩා තමාගේ සහ අනුන්ගේ ආරක්ෂාව තහවුරු කරගැනීම බුද්ධිමත්ය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"අවධානය සහ ප්‍රවේශම","tags":["අවධානය සහ ප්‍රවේශම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":375,"category":"caution","english":{"proverb":"Keep in mind that When in Rome, do as the Romans do","meaning":"Harmonize with the accepted etiquette, traditions, and habits of your surroundings. Cultivating this understanding brings harmony and resilience.","categoryName":"Caution & Foresight","tags":["Caution & Foresight","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: ஆபத்தில் உதவும் விவேகம்","meaning":"எதிர்பாராத நெருக்கடி ஏற்படும்போது கலங்காமல் சமயோசித புத்தியுடன் செயல்படுவதே அறிவாகும். இந்த விவேகத்தைக் கடைப்பிடி  ආදර්ශය: කාලය රත්තරන් හා සමානයි","meaning":"නැවත කිසිදා ආපසු ලබාගත නොහැකි කාලය ඉතා ඵලදායී ලෙස ජීවිතය ගොඩනැගීමට යොදාගත යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":464,"category":"patience","english":{"proverb":"A golden rule: Haste makes waste","meaning":"Rushing through tasks recklessly inevitably breeds clumsy blunders that demand double labor to correct. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: பதறாத காரியம் சிதறாது","meaning":"பதற்றமின்றி நிதானமாகத் திட்டமிட்டுச் செய்யப்படும் காரியங்கள் ஒருபோதும் தோல்வியில் முடிவதில்லை. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: හදිසිය විනාශයට මගයි","meaning":"කලබලයෙන් හා කඩිමුඩියේ කරන කටයුතු සියල්ල ව්‍යර්ථ වී පාඩු සිදුවීමට ඇති ඉඩකඩ වැඩිය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":465,"category":"patience","english":{"proverb":"Keep in mind that Slow and steady wins the race","meaning":"Consistent, unfaltering perseverance invariably triumphs over erratic, flashy bursts of energy. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: ஆத்திரக்காரனுக்கு புத்தி மட்டு","meaning":"கட்டுக்கடங்காத கோபத்தில் முடிவெடுப்பவன் தன் அறிவை இழந்து பெரும் நஷ்டத்தை அடைவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: කේන්තිය නුවණට මරු පහරකි","meaning":"කෝපය පාලනය කරගත නොහැකි වූ විට පුද්ගලයාගේ බුද්ධිය නැතිවී අඥාන තීරණ ගනී. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":466,"category":"patience","english":{"proverb":"Remember well: Everything comes to him who waits","meaning":"Disciplined persistence and composure ultimately align circumstances in your rightful favor. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: பொறுத்தவர் கையில் உலகம்","meaning":"உரிய காலம் வரும் வரை பொறுமையுடன் காத்திருந்து செயல்படுபவன் அனைத்தையும் தன் வசமாக்குவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: සුදුසු වේලාව එනතුරු බලා සිටින්න","meaning":"ඕනෑම හොඳ කාර්යයකට පවා නියමිත කාලයක් ඇති බැවින් එතෙක් ඉවසීමෙන් සූදානම් විය යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":467,"category":"patience","english":{"proverb":"In moments of decision: You cannot rush a sunrise","meaning":"Certain vital processes of life, growth, and destiny must unfold according to their inherent natural rhythm. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: காலம் போகும் வழி பார்த்து நட","meaning":"சூழலின் போக்கையும் காலத்தின் தேவையையும் உணர்ந்து அதற்குத் தக பொறுமையுடன் நகர்வதே சிறப்பு. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: කාලය සියලු තුවාල සුවපත් කරයි","meaning":"ජීවිතයේ සිදුවන දැඩි සිත් රිදීම් සහ වියෝවන් කාලයත් සමඟ ක්‍රමයෙන් සමනය වී යයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":468,"category":"patience","english":{"proverb":"Heed the adage: Patience is bitter, but its fruit is sweet","meaning":"While enduring forbearance feels painful in the moment, its ultimate harvest is extraordinarily delicious. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: அவசரக் குடுக்கை அழியத் தயார்","meaning":"எதற்கெடுத்தாலும் பொறுமையின்றி படபடப்பவன் நல்ல வாய்ப்புகளையும் கெடுத்துக்கொண்டு அழிவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: ගහේ ගෙඩි ඉදුණු පසු නිරායාසයෙන් වැටේ","meaning":"අකාලයේ බලෙන් ඵල නෙළීමට වඩා නිසි පරිණතභාවයට පත්වූ පසු ලබන ප්‍රතිඵලය මිහිරි වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":469,"category":"patience","english":{"proverb":"A golden rule: Time and tide wait for no man","meaning":"The unstoppable currents of time roll forward irrespective of human vanity or unpreparedness. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: பழுத்த பழம் தானாக விழும்","meaning":"எந்தவொரு பலனும் உரிய காலம் கனிந்த பின்னரே நமக்கு முழுமையான சுவையுடன் வந்து சேரும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: වැස්සට පසු හිරු පායයි","meaning":"දුක්බර අඳුරු කාලය අවසානයේදී සතුට හා සැනසීම උදාවන සුන්දර යුගයක් අනිවාර්යයෙන්ම එළඹේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":470,"category":"patience","english":{"proverb":"Keep in mind that A watched pot never boils","meaning":"Obsessing impatiently over an inevitable process only makes the duration feel agonizingly protracted. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: காய்த்த மரம் கல்லடி படும்","meaning":"பயனுள்ள நல்ல மனிதர்களே பலரின் விமர்சனங்களுக்கும் தாக்குதல்களுக்கும் ஆளாவார்கள்; அதைப் பொறுத்துக் கொள்ள வேண்டும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: නොඉවසිලිවන්තයාට නිතරම අතපසුවීම්ය","meaning":"ඉක්මන් වී වැරදි කරගන්නවාට වඩා සන්සුන්ව කාලය කළමනාකරණය කරගැනීම ප්‍රශස්තය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":471,"category":"patience","english":{"proverb":"Remember well: Patience is a plaster for all sores","meaning":"Quiet endurance acts as a soothing balm upon emotional grievances and wounds. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: இருண்ட இரவின் பின் விடியல் உண்டு","meaning":"வாழ்க்கையில் எத்தனை துன்பமான இருள் சூழ்ந்தாலும் அதன் பின் ஒளிமயமான விடியல் நிச்சயம் வரும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.", ategoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: සන්සුන් බව සුවය ගෙනදෙයි","meaning":"අනවශ්‍ය කලබලයෙන් තොරව ජීවිතයට මුහුණ දීමෙන් කායික හා මානසික සුවය නිරතුරුව රැකේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":476,"category":"patience","english":{"proverb":"Remember well: One moment of patience may ward off great disaster","meaning":"Suppressing a volatile flash of temper saves years of bitter ruin and lamentation. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: நிதானமே சிறந்த மருந்து","meaning":"மனக்குழப்பமும் சோதனைகளும் வரும்போது அமைதியான நிதானமே சிறந்த தீர்வாக அமையும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: නිසි කලට නිසි තැන ක්‍රියාකරන්න","meaning":"කාලෝචිත ක්‍රියාවෙන්ම පමණක් උපරිම සාර්ථකත්වය හා ගෞරවය අත්වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":477,"category":"patience","english":{"proverb":"In moments of decision: Tomorrow is another day","meaning":"Whatever grief transpired today, the dawn brings renewed vitality and another chance. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: காலம் மாற்றத்தை நிச்சயம் தரும்","meaning":"இன்று இருக்கும் நிலைமை நிரந்தரமல்ல; காலம் எல்லாவற்றையும் மாற்றியமைக்கும் ஆற்றல் கொண்டது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":" ் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: මොහොතක ඉවසීම වසර ගණනාවක පසුතැවීම වළකයි","meaning":"කෝපය ඇවිළුණු ක්ෂණික මොහොතක ඉවසා සිටීමෙන් මුළු ජීවිතයම විනාශ වීමෙන් බේරාගත හැක. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":480,"category":"patience","english":{"proverb":"Keep in mind that He who can endure will conquer","meaning":"Mastery of destiny belongs ultimately to the soul that outlasts every passing storm. Cultivating this understanding brings harmony and resilience.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: காலமறிந்து செயல்படு","meaning":"பொருத்தமான காலத்தையும் இடத்தையும் அறிந்து காரியங்களைச் செய்பவன் எளிதில் இலக்கை அடைவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: කාලය සමඟ යහපත් දේ නිර්මාණය වේ","meaning":"ශ්‍රේෂ්ඨ නිර්මාණ හා සදාචාර සම්පන්න චරිත ගොඩනැගීමට දීර්ඝ කාලයක් හා ඉවසීමක් අවශ්‍ය වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":481,"category":"patience","english":{"proverb":"Universal Adage: Patience is a virtue","meaning":"Essential insight for all seekers: The capacity to endure delay, hardship, and frustration calmly is a crowning moral excellence.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வியல் தத்துவம்: பொறுத்தார் பூமி ஆள்வார்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: கோபப்படாமல் நிதானத்துடனும் பொறுமையுடனும் செயல்படுபவரே இறுதியில் மாபெரும் வெற்றியையும் உலகையும் ஆள்வார்.","categoryName":"பொறுமையும் காலமும்","tags ce & Timing","Adage","Wisdom"]},"tamil":{"proverb":"மரபுச் செல்வம்: பொறுமையே பலவீனம் அல்ல, பேராற்றல்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: சகிப்புத்தன்மையுடன் இருப்பது கோழைத்தனம் அல்ல; அது அளப்பரிய மனவலிமையின் அடையாளம்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"උතුම් ජීවන මග: මොහොතක ඉවසීම වසර ගණනාවක පසුතැවීම වළකයි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: කෝපය ඇවිළුණු ක්ෂණික මොහොතක ඉවසා සිටීමෙන් මුළු ජීවිතයම විනාශ වීමෙන් බේරාගත හැක.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":500,"category":"patience","english":{"proverb":"Heritage Teaching: He who can endure will conquer","meaning":"Essential insight for all seekers: Mastery of destiny belongs ultimately to the soul that outlasts every passing storm.","categoryName":"Patience & Timing","tags":["Patience & Timing","Adage","Wisdom"]},"tamil":{"proverb":"அனுபவப் பாடம்: காலமறிந்து செயல்படு","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: பொருத்தமான காலத்தையும் இடத்தையும் அறிந்து காரியங்களைச் செய்பவன் எளிதில் இலக்கை அடைவான்.","categoryName":"பொறுமையும் காலமும்","tags":["பொறுமையும் காலமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"සදාචාර නීතිය: කාලය සමඟ යහපත් දේ නිර්මාණය වේ","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: ශ්‍රේෂ්ඨ නිර්මාණ හා සදාචාර සම්පන්න චරිත ගොඩනැගීමට දීර්ඝ කාලයක් හා ඉවසීමක් අවශ්‍ය වේ.","categoryName":"ඉවසීම සහ කාලය","tags":["ඉවසීම සහ කාලය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":501,"category":"character","english":{"proverb":"Pride goes before destruction, and a haughty spirit before a fall","meaning":"Arrogant overestimation of one's invulnerability precipitates humiliating collapse.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"பணிவுடையன் இன்சொலன் ஆதல் ஒருவற்கு அணியல்ல மற்றுப் பிற","meaning":"அடக்கமும் இன்சொல்லும் மட்டுமே ஒரு மனிதனுக்கு உண்மையான அணிகலன்; மற்றைய ஆபரணங்கள் எதுவ dom"]},"tamil":{"proverb":"மெய்யாகவே, சான்றாண்மை என்பது நற்குணங்களின் தொகுப்பு","meaning":"அன்பு, நாணம், ஒப்புரவு, கண்ணோட்டம், வாய்மை ஆகிய நற்பண்புகளே உண்மையான ஆளுமை. (பாரம்பரிய வாழ்வியல் விளக்கம் #528)","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"සැබවින්ම, උඩඟුකම විනාශයේ මූලයයි","meaning":"තමා සියල්ලන්ට වඩා උසස් යැයි සිතා අනුන් පහත් කර සලකන තැනැත්තාගේ විනාශය ඉතා ළඟය. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #528)","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":529,"category":"character","english":{"proverb":"It is well said that integrity is doing the right thing when no one is watching","meaning":"True character is tested when actions carry zero public applause or threat of exposure. (Deep cultural perspective #529)","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"சான்றோர் உரைப்பது: கனிந்த பழம் தலை வணங்கும்","meaning":"நிறைந்த அறிவும் ஞானமும் கொண்ட பெருமக்கள் என்றும் கர்வமின்றி பணிவோடு தலைவணங்கி இருப்பார்கள். (பாரம்பரிய வாழ்வியல் விளக்கம் #529)","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණැත්තන් පවසන පරිදි, අනුන්ට ඊර්ෂ්‍යා නොකරන්න","meaning":"අන්‍යයන්ගේ දියුණුව දැක සතුටු විය නොහැකි ඊර්ෂ්‍යාකාරී සිත තමාගේම ජීවිතය කාදමන පිළිකාවකි. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #529)","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":530,"category":"character","english":{"proverb":"Wisdom teaches that kindness is a language which the deaf can hear and the blind can see","meaning":"Pure goodness transcends all linguistic and physical barriers effortlessly. (Deep cultural perspective #530)","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வியல் உண்மை: மானம் பெரிதென வாழ்","meaning":"செல்வத்தை இழப்பினும் தனது சுயமரியாதையையும் ஒழுக்கத்தையும் இழ mility","Adage","Wisdom"]},"tamil":{"proverb":"அடக்கம் அமரருள் உய்க்கும் அடங்காமை ஆரிருள் உய்த்து விடும் - சான்றோர்கள் போற்றிய நற்பாதையாகும்","meaning":"பொன்மொழி விளக்கம்: விவேகமான அடக்கமே ஒருவனை உயர்நிலைக்குக் கொண்டுசெல்லும்; கர்வமும் அடங்காமையும் அவனைப் படுகுழியில் தள்ளும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"කෙළෙහිගුණ දන්නා මිනිසා දෙවියන් සමානයි - පරපුරෙන් පරපුරට රැකගත් වටිනා අවවාදයකි","meaning":"උතුම් උපදේශය: තමන්ට කළ සුළු උපකාරයක් පවා ජීවිත කාලය පුරාම සිහිපත් කර ගරුකරන මිනිසා උතුම්ය.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":544,"category":"character","english":{"proverb":"Beauty is only skin deep, a timeless truth of life","meaning":"A golden principle: Physical allure is purely superficial, whereas authentic character, kindness, and virtue endure.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"குணம் என்னும் குன்றேறி நின்றார் வெகுளி கணமேனும் காத்தல் அரிது - அறிவுடையோர் என்றும் மறவாத நெறியாகும்","meaning":"பொன்மொழி விளக்கம்: நற்குணங்கள் நிறைந்த சான்றோரின் நற்பெயரும் மரியாதையும் எந்தச் சூழலிலும் கலங்காமல் நிலைத்து நிற்கும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරහංකාරකම උතුම්ම ආභරණයයි - බුද්ධිමතුන් සැමවිටම අනුගමනය කළ ප්‍රතිපත්තියකි","meaning":"උතුම් උපදේශය: බාහිර වස්ත්‍ර හා ආභරණවලට වඩා මිනිසෙකු ලස්සන කරන්නේ ඔහුගේ නිහතමානී පිවිතුරු චරිතයයි.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":545,"category":"character","english":{"proverb":"A good name is better than riches, as the wise observe","meaning":"A golden principle: An unblemished reputation for honor and dependability commands far higher reverence than gold.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"உள்ளுவதெல்லாம் உயர்வுள்ள ags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"அன்பிலார் எல்லாம் தமக்குரியர் அன்புடையார் என்பும் உரியர் பிறர்க்கு - சான்றோர்கள் போற்றிய நற்பாதையாகும்","meaning":"பொன்மொழி விளக்கம்: அன்பில்லாத சுயநலவாதிகள் அனைத்தையும் தமக்கே என்பார்கள்; அன்புள்ளவரோ தன் உடலையும் பிறர்க்கு அர்ப்பணிப்பர்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"සැමට ගරු කරන්න - පරපුරෙන් පරපුරට රැකගත් වටිනා අවවාදයකි","meaning":"උතුම් උපදේශය: තනතුර, වයස හෝ ධනය නොසලකා සෑම මිනිසෙකුටම මානුෂීය ගෞරවය දැක්වීම උසස් සංස්කෘතියකි.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":559,"category":"character","english":{"proverb":"Gratitude is the memory of the heart, a timeless truth of life","meaning":"A golden principle: Remembering benefactors with enduring appreciation marks a genuinely refined spirit.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"பொறாமை கொண்டவன் உருப்படான் - அறிவுடையோர் என்றும் மறவாத நெறியாகும்","meaning":"பொன்மொழி விளக்கம்: அடுத்தவரின் வளர்ச்சியைக் கண்டு பொறாமைப்படுபவன் தன் சொந்த அமைதியையும் நிம்மதியையும் இழப்பான்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"සැබෑ වීරයා තමාගේ කෝපය ජයගත් තැනැත්තායි - බුද්ධිමතුන් සැමවිටම අනුගමනය කළ ප්‍රතිපත්තියකි","meaning":"උතුම් උපදේශය: අන් අය සමඟ සටන් කර ජයගන්නවාට වඩා තමා තුළ ඇති නපුරු ගති දමනය කරගැනීම වීරකමකි.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":560,"category":"character","english":{"proverb":"He that respects not is not respected, as the wise observe","meaning":"A golden principle: Reverence for others is the foundational currency required to receive reciprocal esteem.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"எளியோர்க்கு இரங்குவதே தர்மம் - தலைமுறைகள் கடந்த நல்விளக்கமாகும்","meaning":"பொன்மொழி விளக்கம்: துன்பப்படும் ஏழைகளுக்கும் பலவீனமானவர்களுக்கும் செய்யும் உதவியே வாழ்க்கையின் சிறந்த புண்ணியம்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"පිරිසිදු හෘදසාක්ෂිය සුව නින්දක් ගෙනදෙයි - ජීවිතයේ යථාර්ථය පෙන්වාදෙන කැඩපතකි","meaning":"උතුම් උපදේශය: කිසිවෙකුට ද්‍රෝහි නොවී ධර්මානුකූලව ජීවත්වන මිනිසාට බියෙන් තොර ප්‍රීතිමත් ජීවිතයක් හිමිවේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":561,"category":"character","english":{"proverb":"Remember well: Pride goes before destruction, and a haughty spirit before a fall","meaning":"Arrogant overestimation of one's invulnerability precipitates humiliating collapse. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: பணிவுடையன் இன்சொலன் ஆதல் ஒருவற்கு அணியல்ல மற்றுப் பிற","meaning":"அடக்கமும் இன்சொல்லும் மட்டுமே ஒரு மனிதனுக்கு உண்மையான அணிகலன்; மற்றைய ஆபரணங்கள் எதுவும் ஈடாகாது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: පැසෙන ගොයම බිමට නැමෙයි","meaning":"සැබෑ ඥානයෙන් හා සද්ගුණයෙන් පිරිපුන් ශ්‍රේෂ්ඨ මිනිසා කවදාවත් උඩඟු නොවී නිහතමානීව සිටියි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":562,"category":"character","english":{"proverb":"In moments of decision: Humility is the foundation of all virtues","meaning":"A modest, self-effacing spirit provides the fertile soil wherein genuine nobility blossoms. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: யானைக்கும் அடி சறுக்கும்","meaning":"எவ்வளவு திறமையும் பலமும் மிக்க பெரிய மனிதர்களுக்கும் சில நேரங்களில் சறுக்கல்களும் தவறுகளும் நேரலாம். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: අලියා වැටුණත් වලේ","meaning":"කොතරම් බලවත් ධනවත් මිනිසෙකු වුවද උඩඟු වුවහොත් ඔහුටද පිරිහීමකට මුහුණ දීමට සිදුවේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":563,"category":"character","english":{"proverb":"Heed the adage: The boughs that bear most hang lowest","meaning":"Persons possessing genuine wisdom and profound accomplishments remain the most unassuming and gracious. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: அடக்கம் அமரருள் உய்க்கும் அடங்காமை ஆரிருள் உய்த்து விடும்","meaning":"விவேகமான அடக்கமே ஒருவனை உயர்நிலைக்குக் கொண்டுசெல்லும்; கர்வமும் அடங்காமையும் அவனைப் படுகுழியில் தள்ளும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: කෙළෙහිගුණ දන්නා මිනිසා දෙවියන් සමානයි","meaning":"තමන්ට කළ සුළු උපකාරයක් පවා ජීවිත කාලය පුරාම සිහිපත් කර ගරුකරන මිනිසා උතුම්ය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":564,"category":"character","english":{"proverb":"A golden rule: Beauty is only skin deep","meaning":"Physical allure is purely superficial, whereas authentic character, kindness, and virtue endure. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: குணம் என்னும் குன்றேறி நின்றார் வெகுளி கணமேனும் காத்தல் அரிது","meaning":"நற்குணங்கள் நிறைந்த சான்றோரின் நற்பெயரும் மரியாதையும் எந்தச் சூழலிலும் கலங்காமல் நிலைத்து நிற்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: නිරහංකාරකම උතුම්ම ආභරණයයි","meaning":"බාහිර වස්ත්‍ර හා ආභරණවලට වඩා මිනිසෙකු ලස්සන කරන්නේ ඔහුගේ නිහතමානී පිවිතුරු චරිතයයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":565,"category":"character","english":{"proverb":"Keep in mind that A good name is better than riches","meaning":"An unblemished reputation for honor and dependability commands far higher reverence than gold. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: உள்ளுவதெல்லாம் உயர்வுள்ளல்","meaning":"நமது எண்ணங்களும் நோக்கங்களும் எப்போதும் உயர்ந்ததாகவும் மேன்மையானதாகவும் இருக்க வேண்டும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: තමන්ගේ වරද දැකීම නියම දක්ෂතාවයි","meaning":"අනුන්ගේ ඇද කුද සොයනවාට වඩා තමාගේ අඩුපාඩු හඳුනාගෙන ඒවා නිවැරදි කරගැනීම උසස්ය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":566,"category":"character","english":{"proverb":"Remember well: Charity begins at home","meaning":"True compassion and moral duty must first be practiced
