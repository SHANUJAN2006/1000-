th honor than rich with shame","meaning":"Material scarcity lived with upright dignity is incomparably sweeter than ill-gotten wealth. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: சான்றாண்மை என்பது நற்குணங்களின் தொகுப்பு","meaning":"அன்பு, நாணம், ஒப்புரவு, கண்ணோட்டம், வாய்மை ஆகிய நற்பண்புகளே உண்மையான ஆளுமை. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: උඩඟුකම විනාශයේ මූලයයි","meaning":"තමා සියල්ලන්ට වඩා උසස් යැයි සිතා අනුන් පහත් කර සලකන තැනැත්තාගේ විනාශය ඉතා ළඟය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":569,"category":"character","english":{"proverb":"A golden rule: Integrity is doing the right thing when no one is watching","meaning":"True character is tested when actions carry zero public applause or threat of exposure. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: கனிந்த பழம் தலை வணங்கும்","meaning":"நிறைந்த அறிவும் ஞானமும் கொண்ட பெருமக்கள் என்றும் கர்வமின்றி பணிவோடு தலைவணங்கி இருப்பார்கள். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: අනුන්ට ඊර්ෂ්‍යා නොකරන්න","meaning":"අන්‍යයන්ගේ දියුණුව දැක සතුටු විය නොහැකි ඊර්ෂ්‍යාකාරී සිත තමාගේම ජීවිතය කාදමන පිළිකාවකි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":570,"category":"character","english":{"proverb":"Keep in mind that Kindness is a language which the deaf can hear and the blind can see","meaning":"Pure goodness transcends all linguistic and physical barriers effortlessly. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: மானம் பெரிதென வாழ்","meaning":"செல்வத்தை இழப்பினும் தனது சுயமரியாதையையும் ஒழுக்கத்தையும் இழக்காமல் வாழ்வதே வீரமாகும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: ආත්ම දමනය ශ්‍රේෂ්ඨතම විජයග්‍රහණයයි","meaning":"තමාගේම සිත, කය සහ වචනය දැහැමි ලෙස පාලනය කරගැනීම මුළු ලෝකයම දිනනවාට වඩා අසීරුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":571,"category":"character","english":{"proverb":"Remember well: Modesty becomes the wise","meaning":"The truly brilliant need not boast, for authentic excellence speaks with its own quiet authority. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: பிறர்க்கின்னா முற்பகல் செய்யின் தமக்கின்னா பிற்பகல் தாமே வரும்","meaning":"முற்பகலில் பிறருக்குச் செய்யும் தீமைகள் பிற்பகலில் தானாகவே நம்மைத் தேடி வந்து அழிக்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: කරුණාව සියලු හදවත් දිනයි","meaning":"දුකට පත් ඕනෑම සත්වයෙකු කෙරෙහි දක්වන දයාව හා අනුකම්පාව උතුම්ම මිනිස්කමයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":572,"category":"character","english":{"proverb":"In moments of decision: A tree is known by its fruit","meaning":"The authentic moral value of a person is revealed through the tangible outcomes of their life. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: மன்னிக்கும் குணமே மாண்பு","meaning":"தவறிழைத்தவர்களை மன்னித்து அவர்களுக்கு நல்வழிகாட்டும் பெருந்தன்மையே ஒருவனை உயர்த்தும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: නරක ආශ්‍රයෙන් ඈත් වන්න","meaning":"දුදනන් සමඟ මිත්‍ර වීමෙන් තමාගේ පිරිසිදු චරිතයද කිලිටි වී විනාශයට පත්විය හැක. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":573,"category":"character","english":{"proverb":"Heed the adage: A guilty conscience needs no accuser","meaning":"Inner moral remorse tortures the transgressor long before external justice arrives. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: தீயாரோடு இணங்காதே","meaning":"ஒழுக்கமற்றவர்களோடு கொள்ளும் தொடர்பு நற்குணம் கொண்டவனின் புகழையும் சீரழித்துவிடும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: අවංකකම ජීවිතයේ කොඳුනාරටියයි","meaning":"කිසිවෙකු නොබලන මොහොතක පවා නිවැරදි සාධාරණ දේ පමණක් කිරීම සැබෑ විනයයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":574,"category":"character","english":{"proverb":"A golden rule: Forgiveness is the attribute of the strong","meaning":"Only those possessing profound inner fortitude can release bitterness and grant pardon. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: நன்றியில்லாதவன் நாயினும் கடை","meaning":"செய்த நன்றியை மறந்து துரோகம் இழைப்பவன் மனிதப் பிறவியின் நற்பண்புகளையே இழந்துவிடுகிறான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: ලැබුණු දෙයින් සතුටුවීම සැනසිල්ලයි","meaning":"අනවශ්‍ය තණ්හාවෙන් දැවෙන්නේ නැතිව තමා සතු දෙයින් තෘප්තිමත්වීම සැබෑ ධනවත්කමයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":575,"category":"character","english":{"proverb":"Keep in mind that Self-conquest is the greatest victory","meaning":"Mastering one's own appetites, impulses, and ego surpasses conquering mighty empires. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: சுயக்கட்டுப்பாடே பெரும் சக்தி","meaning":"தன் ஐம்புலன்களையும் ஆசைகளையும் கட்டுப்படுத்தி வாழ்பவனே உலகை ஆளும் பேராற்றல் பெறுகிறான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: පරාර්ථකාමීත්වය ජීවිතය ආලෝකවත් කරයි","meaning":"තමා වෙනුවෙන් පමණක් නොව සමාජයේ යහපත වෙනුවෙන් යමක් කැපකිරීමෙන් ජීවිතය අර්ථවත් වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":576,"category":"character","english":{"proverb":"Remember well: Live not to eat, but eat to live","meaning":"Sensory moderation preserves clarity of mind, health of body, and spiritual tranquility. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: இரக்கமே அறத்தின் வேர்","meaning":"எல்லா உயிர்களிடத்தும் காட்டும் கருணையும் இரக்கமுமே உண்மையான ஆன்மிகத்தின் அடித்தளம். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: උදාර සිතිවිලි සිතෙහි රඳවන්න","meaning":"යහපත් උසස් ආකල්ප නිතර සිතීමෙන් මිනිසාගේ මුළු ජීවන රටාවම සුගන්ධවත් වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":577,"category":"character","english":{"proverb":"In moments of decision: Noble blood is an accident of fortune, noble action is an achievement of your own","meaning":"Pedigree is mere chance, but honorable deeds reflect your personal soul. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: நற்குடும்பத்துப் பிறப்பு நற்பண்பில் தெரியும்","meaning":"ஒருவரின் குடிப்பெருமை என்பது அவர்கள் பிறரிடம் காட்டும் ஒழுக்கத்திலும் பண்பான நடத்தை முறையிலும் புலப்படும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: වැරදි කිරීම මිනිස් ගතියකි, නිවැරදි වීම දේව ගතියකි","meaning":"අතපසුවීම් සිදුවිය හැකි නමුත් ඒවා වටහාගෙන නිවැරදි මාවතට පිවිසීම ප්‍රශංසනීයයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":578,"category":"character","english":{"proverb":"Heed the adage: A clean hand wants no washing","meaning":"One who acts with scrupulous innocence fears no examination or slander. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: அன்பிலார் எல்லாம் தமக்குரியர் அன்புடையார் என்பும் உரியர் பிறர்க்கு","meaning":"அன்பில்லாத சுயநலவாதிகள் அனைத்தையும் தமக்கே என்பார்கள்; அன்புள்ளவரோ தன் உடலையும் பிறர்க்கு அர்ப்பணிப்பர். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: සැමට ගරු කරන්න","meaning":"තනතුර, වයස හෝ ධනය නොසලකා සෑම මිනිසෙකුටම මානුෂීය ගෞරවය දැක්වීම උසස් සංස්කෘතියකි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":579,"category":"character","english":{"proverb":"A golden rule: Gratitude is the memory of the heart","meaning":"Remembering benefactors with enduring appreciation marks a genuinely refined spirit. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: பொறாமை கொண்டவன் உருப்படான்","meaning":"அடுத்தவரின் வளர்ச்சியைக் கண்டு பொறாமைப்படுபவன் தன் சொந்த அமைதியையும் நிம்மதியையும் இழப்பான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: සැබෑ වීරයා තමාගේ කෝපය ජයගත් තැනැත්තායි","meaning":"අන් අය සමඟ සටන් කර ජයගන්නවාට වඩා තමා තුළ ඇති නපුරු ගති දමනය කරගැනීම වීරකමකි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":580,"category":"character","english":{"proverb":"Keep in mind that He that respects not is not respected","meaning":"Reverence for others is the foundational currency required to receive reciprocal esteem. Cultivating this understanding brings harmony and resilience.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: எளியோர்க்கு இரங்குவதே தர்மம்","meaning":"துன்பப்படும் ஏழைகளுக்கும் பலவீனமானவர்களுக்கும் செய்யும் உதவியே வாழ்க்கையின் சிறந்த புண்ணியம். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: පිරිසිදු හෘදසාක්ෂිය සුව නින්දක් ගෙනදෙයි","meaning":"කිසිවෙකුට ද්‍රෝහි නොවී ධර්මානුකූලව ජීවත්වන මිනිසාට බියෙන් තොර ප්‍රීතිමත් ජීවිතයක් හිමිවේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":581,"category":"character","english":{"proverb":"Universal Adage: Pride goes before destruction, and a haughty spirit before a fall","meaning":"Essential insight for all seekers: Arrogant overestimation of one's invulnerability precipitates humiliating collapse.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வியல் தத்துவம்: பணிவுடையன் இன்சொலன் ஆதல் ஒருவற்கு அணியல்ல மற்றுப் பிற","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: அடக்கமும் இன்சொல்லும் மட்டுமே ஒரு மனிதனுக்கு உண்மையான அணிகலன்; மற்றைய ஆபரணங்கள் எதுவும் ஈடாகாது.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"විශ්ව සත්‍යය: පැසෙන ගොයම බිමට නැමෙයි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: සැබෑ ඥානයෙන් හා සද්ගුණයෙන් පිරිපුන් ශ්‍රේෂ්ඨ මිනිසා කවදාවත් උඩඟු නොවී නිහතමානීව සිටියි.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":582,"category":"character","english":{"proverb":"Living Truth: Humility is the foundation of all virtues","meaning":"Essential insight for all seekers: A modest, self-effacing spirit provides the fertile soil wherein genuine nobility blossoms.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"முதுமொழி நெறி: யானைக்கும் அடி சறுக்கும்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: எவ்வளவு திறமையும் பலமும் மிக்க பெரிய மனிதர்களுக்கும் சில நேரங்களில் சறுக்கல்களும் தவறுகளும் நேரலாம்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"පාරම්පරික උපදෙස: අලියා වැටුණත් වලේ","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: කොතරම් බලවත් ධනවත් මිනිසෙකු වුවද උඩඟු වුවහොත් ඔහුටද පිරිහීමකට මුහුණ දීමට සිදුවේ.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":583,"category":"character","english":{"proverb":"Sage Counsel: The boughs that bear most hang lowest","meaning":"Essential insight for all seekers: Persons possessing genuine wisdom and profound accomplishments remain the most unassuming and gracious.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"அறவழிக் கருத்து: அடக்கம் அமரருள் உய்க்கும் அடங்காமை ஆரிருள் உய்த்து விடும்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: விவேகமான அடக்கமே ஒருவனை உயர்நிலைக்குக் கொண்டுசெல்லும்; கர்வமும் அடங்காமையும் அவனைப் படுகுழியில் தள்ளும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"ජනශ්‍රැති ප්‍රඥාව: කෙළෙහිගුණ දන්නා මිනිසා දෙවියන් සමානයි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: තමන්ට කළ සුළු උපකාරයක් පවා ජීවිත කාලය පුරාම සිහිපත් කර ගරුකරන මිනිසා උතුම්ය.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":584,"category":"character","english":{"proverb":"Folk Wisdom: Beauty is only skin deep","meaning":"Essential insight for all seekers: Physical allure is purely superficial, whereas authentic character, kindness, and virtue endure.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"மரபுச் செல்வம்: குணம் என்னும் குன்றேறி நின்றார் வெகுளி கணமேனும் காத்தல் அரிது","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: நற்குணங்கள் நிறைந்த சான்றோரின் நற்பெயரும் மரியாதையும் எந்தச் சூழலிலும் கலங்காமல் நிலைத்து நிற்கும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"උතුම් ජීවන මග: නිරහංකාරකම උතුම්ම ආභරණයයි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: බාහිර වස්ත්‍ර හා ආභරණවලට වඩා මිනිසෙකු ලස්සන කරන්නේ ඔහුගේ නිහතමානී පිවිතුරු චරිතයයි.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":585,"category":"character","english":{"proverb":"Heritage Teaching: A good name is better than riches","meaning":"Essential insight for all seekers: An unblemished reputation for honor and dependability commands far higher reverence than gold.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"அனுபவப் பாடம்: உள்ளுவதெல்லாம் உயர்வுள்ளல்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: நமது எண்ணங்களும் நோக்கங்களும் எப்போதும் உயர்ந்ததாகவும் மேன்மையானதாகவும் இருக்க வேண்டும்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"සදාචාර නීතිය: තමන්ගේ වරද දැකීම නියම දක්ෂතාවයි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම ුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":588,"category":"character","english":{"proverb":"Sage Counsel: Better poor with honor than rich with shame","meaning":"Essential insight for all seekers: Material scarcity lived with upright dignity is incomparably sweeter than ill-gotten wealth.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"அறவழிக் கருத்து: சான்றாண்மை என்பது நற்குணங்களின் தொகுப்பு","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: அன்பு, நாணம், ஒப்புரவு, கண்ணோட்டம், வாய்மை ஆகிய நற்பண்புகளே உண்மையான ஆளுமை.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"ජනශ්‍රැති ප්‍රඥාව: උඩඟුකම විනාශයේ මූලයයි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: තමා සියල්ලන්ට වඩා උසස් යැයි සිතා අනුන් පහත් කර සලකන තැනැත්තාගේ විනාශය ඉතා ළඟය.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":589,"category":"character","english":{"proverb":"Folk Wisdom: Integrity is doing the right thing when no one is watching","meaning":"Essential insight for all seekers: True character is tested when actions carry zero public applause or threat of exposure.","categoryName":"Character & Humility","tags":["Character & Humility","Adage","Wisdom"]},"tamil":{"proverb":"மரபுச் செல்வம்: கனிந்த பழம் தலை வணங்கும்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: நிறைந்த அறிவும் ஞானமும் கொண்ட பெருமக்கள் என்றும் கர்வமின்றி பணிவோடு தலைவணங்கி இருப்பார்கள்.","categoryName":"பண்பும் ஒழுக்கமும்","tags":["பண்பும் ஒழுக்கமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"උතුම් ජීවන මග: අනුන්ට ඊර්ෂ්‍යා නොකරන්න","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: අන්‍යයන්ගේ දියුණුව දැක සතුටු විය නොහැකි ඊර්ෂ්‍යාකාරී සිත තමාගේම ජීවිතය කාදමන පිළිකාවකි.","categoryName":"ගුණධර්ම සහ විනය","tags":["ගුණධර්ම සහ විනය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":590,"category":"character","english":{"proverb":"Heritage Teaching: Ki ළු","ජනශ්‍රැතිය"]}},{"id":675,"category":"family","english":{"proverb":"Keep in mind that A broken friendship may be soldered, but will never be sound","meaning":"Severed trust can be patched, but invisible fractures often linger underneath. Cultivating this understanding brings harmony and resilience.","categoryName":"Friendship & Unity","tags":["Friendship & Unity","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: அன்பே பிரதானம்","meaning":"அனைத்து சட்டங்களையும் கோட்பாடுகளையும் விட மனிதர்களிடையே நிலவும் தூய அன்பே உலகை இயக்கும் சக்தி. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நட்பும் சுற்றமும்","tags":["நட்பும் சுற்றமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: අවිශ්වාසය මිත්‍රත්වය විනාශ කරයි","meaning":"සැකය හා කේලාම් නිසා ඇතිවන මතභේද නිරාකරණය කර නොගතහොත් ශක්තිමත් බැඳීම්ද බිඳී යයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"මිත්‍රත්වය සහ සහයෝගය","tags":["මිත්‍රත්වය සහ සහයෝගය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":676,"category":"family","english":{"proverb":"Remember well: Do as you would be done by","meaning":"Treat all companions with the exact fairness, dignity, and grace you desire for yourself. Cultivating this understanding brings harmony and resilience.","categoryName":"Friendship & Unity","tags":["Friendship & Unity","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: சிறு துரும்பும் பல் குத்த உதவும்","meaning":"எவரையும் அற்பமாக நினைக்காமல் அனைவருடனும் நல்லுறவைப் பேணினால் தக்க சமயத்தில் உதவி கிடைக்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நட்பும் சுற்றமும்","tags":["நட்பும் சுற்றமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: එක්ව වැඩකිරීමෙන් කාර්යය පහසු වේ","meaning":"බරක් එකිනෙකා අතර බෙදාගෙන සතුටින් වැඩකිරීමෙන් වෙහෙසක් නොදැනී සාර්ථකත්වය අත්වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"මිත් පරමා ලාභා - නිරෝගීකම උතුම්ම ධනයයි","meaning":"ශරීරයේ රෝග පීඩාදියෙන් තොරව නිරෝගීව ජීවත්වීමට වඩා උසස් වූ සම්පතක් මිනිසාට තවත් නැත. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":762,"category":"wealth","english":{"proverb":"In moments of decision: Contentment is better than riches","meaning":"Inner peace and gratitude for what you have deliver genuine joy that boundless accumulation cannot match. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: போதுமென்ற மனமே பொன்செய்யும் மருந்து","meaning":"கிடைத்த நல்வாழ்வை நிறைவோடு ஏற்றுக்கொண்டு வாழும் உள்ளமே மனிதனுக்கு நிரந்தர நிம்மதியைத் தரும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: සෑහීමකට පත්වීම උතුම්ම සැනසිල්ලයි","meaning":"තමන්ට හිමිවූ දැයින් සතුටුවී තෘප්තිමත් වන මිනිසා තරම් නිදහස් සැනසිලිදායක කෙනෙකු තවත් නැත. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":763,"category":"wealth","english":{"proverb":"Heed the adage: Money cannot buy happiness","meaning":"Transient commercial commodities cannot purchase authentic affection, peace of mind, or spiritual fulfillment. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: பேராசை பெரு நஷ்டம்","meaning":"அளவுக்கு மீறிய பேராசையுடன் அனைத்தையும் அபகரிக்க நினைப்பவன் இறுதியில் இருப்பதையும் இழந்து தவிப்பான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: කෑදරකම විනාශයට මුලයි","meaning":"අසීමිත තණ්හාවෙන් සියල්ල තමන් සතුකර ගැනීමට දඟලන මිනිසා අවසානයේදී සියල්ල අහිමිකර ගනී. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":764,"category":"wealth","english":{"proverb":"A golden rule: Greed loses all by coveting all","meaning":"Inordinate, insatiable avarice blinds the soul and inevitably destroys existing blessings. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: பணம் பந்தியிலே குணம் குப்பையிலே என்றாகாதே","meaning":"பணத்திற்காக நற்குணங்களையும் மனிதநேயத்தையும் கைவிட்டு வாழும் வாழ்வு இழிவானது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: මුදලට සතුට මිලදී ගත නොහැක","meaning":"භෞතික සැප සම්පත් කෝටි ගණනින් තිබුණද අවංක ආදරය හෝ සැබෑ මනසේ සාමය මුදලට ගත නොහැක. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":765,"category":"wealth","english":{"proverb":"Keep in mind that A penny saved is a penny earned","meaning":"Frugal management of daily expenditures steadily builds resilient financial freedom. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: சிறு துளி பெரு வெள்ளம்","meaning":"சிறுகச் சிறுகச் சேர்க்கும் சேமிப்பும் நல்ல பழக்கங்களும் பிற்காலத்தில் பெரும் வாழ்வாதாரமாக உருவெடுக்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: බිංදුව බිංදුව එකතු වී මහ සයුර තැනේ","meaning":"සුළුවෙන් හෝ දිනපතා එකතු කරන ඉතිරිකිරීම් කාලයත් සමඟ විශාල මූල්‍ය ශක්තියක් බවට පත්වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":766,"category":"wealth","english":{"proverb":"Remember well: He is richest who is content with the least","meaning":"The truly affluent person is not one who possesses the most, but who requires the least. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: பணம் எதையும் செய்யும் ஆனால் நிம்மதியைத் தராது","meaning":"பொருளாதார வசதிகள் வாழ்க்கையின் சௌகரியங்களைத் தரும்; ஆனால் தூய மன அமைதியைத் தராது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: අහස උසට ණය නොවන්න","meaning":"තමන්ගේ ආදායමට වඩා වියදම් කරමින් ණය උගුලේ පැටලීමෙන් ජීවිතයේ නිදහස අහිමි වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":767,"category":"wealth","english":{"proverb":"In moments of decision: Money is a good servant but a bad master","meaning":"Wealth used purposefully advances noble works; when worshiped, it enslaves and corrupts the soul. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: அளவுக்கு மிஞ்சினால் அமிர்தமும் நஞ்சு","meaning":"எவ்வளவு மேன்மையான பொருளாக இருந்தாலும் எல்லையைக் கடந்து நுகர்ந்தால் அதுவே ஆபத்தா ைத் தடுக்கும்","meaning":"தேவையற்ற ஆடம்பரங்களைத் தவிர்த்துச் சிக்கனமாக வாழ்வது எதிர்கால வறுமையிலிருந்து பாதுகாக்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: සරල ජීවිතය උසස් සිතුවිලි ගෙනදෙයි","meaning":"ආටෝපයෙන් තොර චාම් දිවිපෙවෙතක් ගතකරන පුද්ගලයාට අනවශ්‍ය පීඩනයන්ගෙන් තොරව සැහැල්ලුවෙන් සිටිය හැක. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":770,"category":"wealth","english":{"proverb":"Keep in mind that Do not bite off more than you can chew","meaning":"Avoid taking on financial or practical obligations that exceed your realistic capacity. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: கடன் வாங்குபவன் தன் சுதந்திரத்தை விற்கிறான்","meaning":"வருமானத்திற்கு அதிகமாகக் கடன் வாங்கி வாழ்பவன் தன் சுயமரியாதையையும் நிம்மதியையும் இழப்பான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: අනුන්ගේ දේට ලොල් නොවන්න","meaning":"තමන්ගේ දහඩියෙන් උපයාගත් දෙයින් සතුටුවීම මිස අනුන් සතු වස්තුව දෙස ගිජු සිතින් නොබැලිය යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":771,"category":"wealth","english":{"proverb":"Remember well: Riches have wings","meaning":"Material fortune can vanish overnight through unforeseen economic storms, folly, or illness. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: வாரி வழங்கும் கைக்கு குறைவில்லை","meaning":"ஏழைகளுக்கும் தேவையுடையோருக்கும் வாரி வழங்கும் வள்ளலின் இல்லத்தில் செல்வம் என்றும் குறையாது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: දීමෙන් ධනය අඩුවන්නේ නැත","meaning":"දුගී මගී අසරණයන්ට කරුණාවෙන් යමක් පරිත්‍යාග කිරීමෙන් සිතට ලැබෙන ප්‍රීතිය අසීමිතය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":772,"category":"wealth","english":{"proverb":"In moments of decision: Borrowing is the mother of trouble","meaning":"Living recklessly beyond one's means incurs debt that paralyzes freedom and dignity. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: செல்வம் நிலையற்றது","meaning":"மின்னல் போலத் தோன்றி மறையும் உலகப் பொருட்களின் மீது கண்மூடித்தனமான பற்று வைக்கக் கூடாது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: ධනය අස්ථිරය","meaning":"ක්ෂණිකව පැමිණ නැතිවී යන ධන සම්පත් කෙරෙහි අන්ධ විශ්වාසය තබා උඩඟු නොවිය යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":773,"category":"wealth","english":{"proverb":"Heed the adage: Waste not, want not","meaning":"Prudent stewardship of resources ensures you will rarely find yourself stranded in dire deprivation. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: உழைப்பால் வந்த செல்வமே நிலைக்கும்","meaning":"நேர்மையான உழைப்பால் உருவான செல்வமே தலைமுறைக்கும் நிலைத்து நின்று ஆசிகளை வழங்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: සාධාරණ ඉපැයීම සතුට ගෙනදෙයි","meaning":"ධාර්මිකව හා අවංකව උපයන සුළු මුදල වුවද පවුලට ආශිර්වාදයක් හා දීර්ඝ සැනසිල්ලක් වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":774,"category":"wealth","english":{"proverb":"A golden rule: You cannot take it with you","meaning":"Worldly possessions are relinquished at the threshold of mortality; only good deeds endure. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: எளிய வாழ்வே மேலான வாழ்வு","meaning":"ஆடம்பரப் பகட்டுகளைத் தவிர்த்து எளிமையைக் கடைப்பிடிப்பவன் தேவையற்ற கவலைகளின்றி வாழ்வான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: නාස්තිය දුප්පත්කමේ දොරටුවයි","meaning":"ලැබෙන සම්පත් අපතේ යවන තැනැත්තා නොබෝ දිනකින්ම හිඟමනට වැටීම වැළැක්විය නොහැක. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":775,"category":"wealth","english":{"proverb":"Keep in mind that A fool and his money are soon parted","meaning":"Those who lack discipline and discernment squander windfall treasures in astonishing haste. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment"," rmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: சுய உழைப்பில் உண்ணும் கஞ்சியும் அமிழ்தம்","meaning":"தன் சொந்த உழைப்பில் கிடைக்கும் எளிய உணவும் நிம்மதியான ஆனந்தத்தை அள்ளித் தரும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: දුප්පත්කම ලැජ්ජාවක් නොවේ, අලසකමයි ලැජ්ජාව","meaning":"ධනය නොමැතිකම වරදක් නොවන නමුත් වැඩ නොකර අලසව හිඳීම මහත් නින්දාවකි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":780,"category":"wealth","english":{"proverb":"Keep in mind that Better an egg today than a hen tomorrow","meaning":"A modest, tangible reality right now is safer than vague promises of future bounty. Cultivating this understanding brings harmony and resilience.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: நிறைந்த உள்ளமே பெருஞ்செல்வம்","meaning":"அகத்தில் திருப்தியும் அமைதியும் கொண்டிருப்பவனே இவ்வுலகில் உண்மையான கோடீஸ்வரன். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: සැබෑ පොහොසතා අඩු අවශ්‍යතා ඇත්තායි","meaning":"තණ්හාවේ වහලෙකු නොවී තමන්ගේ සිත සන්සිඳුවාගත් මිනිසා මුළු ලොවෙහිම ධනවත්ම කෙනාය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":781,"category":"wealth","english":{"proverb":"Universal Adage: Health is the greatest wealth","meaning":"Essential insight for all seekers: A vigorous, unimpaired body and serene mind surpass  Contentment","Adage","Wisdom"]},"tamil":{"proverb":"அறவழிக் கருத்து: பேராசை பெரு நஷ்டம்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: அளவுக்கு மீறிய பேராசையுடன் அனைத்தையும் அபகரிக்க நினைப்பவன் இறுதியில் இருப்பதையும் இழந்து தவிப்பான்.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"ජනශ්‍රැති ප්‍රඥාව: කෑදරකම විනාශයට මුලයි","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: අසීමිත තණ්හාවෙන් සියල්ල තමන් සතුකර ගැනීමට දඟලන මිනිසා අවසානයේදී සියල්ල අහිමිකර ගනී.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":784,"category":"wealth","english":{"proverb":"Folk Wisdom: Greed loses all by coveting all","meaning":"Essential insight for all seekers: Inordinate, insatiable avarice blinds the soul and inevitably destroys existing blessings.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"மரபுச் செல்வம்: பணம் பந்தியிலே குணம் குப்பையிலே என்றாகாதே","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: பணத்திற்காக நற்குணங்களையும் மனிதநேயத்தையும் கைவிட்டு வாழும் வாழ்வு இழிவானது.","categoryName":"செல்வமும் மனநிறைவும்","tags":["செல்வமும் மனநிறைவும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"උතුම් ජීවන මග: මුදලට සතුට මිලදී ගත නොහැක","meaning":"සැමට ප්‍රයෝජනවත් වන මූලික ජීවන පාඩම: භෞතික සැප සම්පත් කෝටි ගණනින් තිබුණද අවංක ආදරය හෝ සැබෑ මනසේ සාමය මුදලට ගත නොහැක.","categoryName":"ධනය සහ සෑහීම","tags":["ධනය සහ සෑහීම","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":785,"category":"wealth","english":{"proverb":"Heritage Teaching: A penny saved is a penny earned","meaning":"Essential insight for all seekers: Frugal management of daily expenditures steadily builds resilient financial freedom.","categoryName":"Wealth & Contentment","tags":["Wealth & Contentment","Adage","Wisdom"]},"tamil":{"proverb":"அனுபவப் பாடம்: சிறு துளி பெரு வெள்ளம்","meaning":"அனைவரும் அறிய வேண்டிய தலையாய வாழ்வியல் பாடம்: சிறுகச் சிறுகச் சேர்க்கும "]}},{"id":826,"category":"justice","english":{"proverb":"Indeed, cheaters never prosper","meaning":"Ill-gotten gains acquired through fraudulent deceit carry the seeds of their own inevitable destruction. (Deep cultural perspective #826)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"பழமொழி கூறுவது போல, பிறர்க்கு இன்னா செய்யற்க","meaning":"எந்தவொரு உயிர்க்கும் மனதாலோ வாக்காலோ செயலாலோ சிறு தீங்கும் விளைவிக்காமல் வாழ்வதே அறம். (பாரம்பரிய வாழ்வியல் விளக்கம் #826)","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"පැරණි ගැමි කියමනක් සේ, වපුරන දේම අස්වැන්න ලෙස ලැබේ","meaning":"අප අනුන්ට යහපත කළහොත් යහපතද, අයහපත කළහොත් විනාශයද ආපසු හිමිවේ. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #826)","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":827,"category":"justice","english":{"proverb":"As the ancients noted, crime does not pay","meaning":"Transgressing moral and civic law ultimately exacts a catastrophic price from the perpetrator. (Deep cultural perspective #827)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"முன்னோர் வாக்குப்படி, அறம் வெல்லும் பாவம் தோற்கும்","meaning":"உலக வரலாற்றில் எந்தக் காலத்திலும் உண்மை அறவழியே வெற்றி பெற்றுள்ளது; அநீதி மண்ணோடு மண்ணாகும். (பாரம்பரிய வாழ்வியல் விளக்கம் #827)","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"පුරාණ ප්‍රස්ථාව පිරුළ අනුව, යුක්තිය පසඳලීම දේව ගතියකි","meaning":"දුප්පත් පොහොසත් භේදයකින් තොරව සැමට සාධාරණ නීතිය ක්‍රියාත්මක කිරීම උතුම් මෙහෙවරකි. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #827)","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":828,"category":"justice","english":{"proverb":"Truly, fair play is a jewel","meaning":"Adhering to scrupulous equity and sportsmanship is a magnificent testament to human nobility. (Deep cultural perspective #828)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"மெய்யாகவே, அடுத்தவர்க்கு குழி பறிப்பவன் தானே விழுவான்","meaning":"பிறருக்குத் தீங்கு செய்ய சதி செய்பவன், தானே அந்த ஆபத்துப் படுகுழியில் வீழ்ந்து மடிவான். (பாரம்பரிய வாழ்வியல் விளக்கம் #828)","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"සැබවින්ම, සොරකම් කළ වස්තුව විනාශය කැඳවයි","meaning":"අනුන්ගේ දේ අයිතිකරගෙන ධනවත් වීමට තැත්කරන මිනිසා මුළු පරම්පරාවටම ශාපයක් උරුම කරගනී. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #828)","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":829,"category":"justice","english":{"proverb":"It is well said that he who digs a pit for others will fall into it himself","meaning":"Those who scheme malicious traps for the innocent invariably stumble into their own snares. (Deep cultural perspective #829)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"சான்றோர் உரைப்பது: தீதும் நன்றும் பிறர்தர வாரா","meaning":"நமக்கு ஏற்படும் நன்மைகளும் துன்பங்களும் பிறரால் வருவதல்ல; நமது சொந்தச் செயல்களின் விளைவே. (பாரம்பரிய வாழ்வியல் விளக்கம் #829)","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණැත්තන් පවසන පරිදි, වරදකරුවාට සිතෙන් සමාවක් නැත","meaning":"පිටතින් කොතෙක් සාධාරණ යැයි පෙන්වුවද වරදක් කළ මිනිසාගේ හෘදසාක්ෂිය නිතරම ඔහුට වදදෙයි. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #829)","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":830,"category":"justice","english":{"proverb":"Wisdom teaches that give credit where credit is due","meaning":"Magnanimously acknowledging the honorable achievements of others reflects supreme integrity. (Deep cultural perspective #830)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வியல் உண்மை: நீதி dged","meaning":"Those who hastily dispense harsh condemnation will find themselves measured by identical scrutiny. (Deep cultural perspective #837)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"முன்னோர் வாக்குப்படி, செய்த பாவம் சும்மா விடாது","meaning":"மறைமுகமாகச் செய்த பாவங்கள் கூட நிழல் போலத் தொடர்ந்து வந்து தக்க தண்டனையைத் தரும். (பாரம்பரிய வாழ்வியல் விளக்கம் #837)","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"පුරාණ ප්‍රස්ථාව පිරුළ අනුව, සත්‍යයේ මාවතේ ගමන් කරන්න","meaning":"කොතෙක් බාධක පැමිණියද අයුක්තියට හිස නොනමා සත්‍යය වෙනුවෙන් පෙනීසිටීම වීරකමකි. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #837)","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":838,"category":"justice","english":{"proverb":"Truly, an eye for an eye will leave the whole world blind","meaning":"Unchecked cycles of vindictive vengeance consume society in complete darkness. (Deep cultural perspective #838)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"மெய்யாகவே, பொய்மைக்கு ஆயுள் குறைவு","meaning":"அநீதியும் ஏமாற்று வேலைகளும் குறுகிய கால வெற்றி பெற்றாலும் விரைவில் மாயமாய் மறைந்துவிடும். (பாரம்பரிய வாழ்வியல் விளக்கம் #838)","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"සැබවින්ම, වරදට දඬුවම නිරායාසයෙන් ලැබේ","meaning":"ස්වභාවධර්මයේ නීතිය කිසිවෙකුටත් විශේෂත්වයක් නොදක්වා වැරදි කළ අයට සුදුසු දඬුවම් පමුණුවයි. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #838)","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":839,"category":"justice","english":{"proverb":"It is well said that innocent until proven guilty","meaning":"Preserving the sanctity of fairness demands rigorous proof before passing sentence. (Deep cultural perspective #839)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"சான்றோர் உரைப்பது: அன்போடு கூடிய நீதியே தெய்வீகம்","meaning":"கடுமையான பழிவாங்கலாக இல்லாமல் கருணையோடு கூடிய நீதியை வழங்குவதே மேலான பண்பு. (பாரம்பரிய வாழ்வியல் விளக்கம் #839)","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණැත්තන් පවසන පරිදි, අනුන්ගේ අයිතිවාසිකම්වලට ගරුකරන්න","meaning":"තමන්ගේ නිදහස භුක්ති විඳින අතරම අන් අයගේ අයිතීන්ට හානියක් නොකිරීමට වගබලාගත යුතුය. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #839)","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":840,"category":"justice","english":{"proverb":"Wisdom teaches that right is right, even if no one is doing it","meaning":"Moral rectitude remains supreme regardless of prevailing public corruption or indifference. (Deep cultural perspective #840)","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வியல் உண்மை: மண் ஆசை கொண்டவன் அழிவான்","meaning":"பிறர் நிலத்தையும் உரிமையையும் அநியாயமாகப் பறிக்க நினைப்பவன் முடிவில் மண்ணோடு கலப்பான். (பாரம்பரிய வாழ்வியல் விளக்கம் #840)","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"පැරණි මුතුන්මිත්තන් පැවසූයේ: සාමකාමී විසඳුම උසස්ය","meaning":"ගැටුම් හා ආරවුල් මගින් නොව සාකච්ඡාවෙන් හා යුක්තියෙන් ප්‍රශ්න නිරාකරණය කරගැනීම ශ්‍රේෂ්ඨය. (දේශීය සංස්කෘතික අර්ථ දැක්වීම #840)","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":841,"category":"justice","english":{"proverb":"As you sow, so shall you reap, for actions mirror character","meaning":"A golden principle: The moral nature of your actions inexorably dictates the harvest of consequences you will collect.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"தன் வினை தன்னைச் சுடும் - இது காலத்தால் அழியாத வாழ்வியல் உண்மை","meaning":"பொன்மொழி விளக்கம்: ஒருவன் பிறருக்குச் செய்யும் வஞ்சகமும் தீமையும் காலப்போக்கில் அவனையே சுட்டெரித்து அழித்துவிடும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"කළකම් පලදේ - මෙය කාලාන්තරයක් තිස්සේ සත්‍යය වූ ධර්මතාවයකි","meaning":"උතුම් උපදේශය: මිනිසා කරන හොඳ හෝ නරක ක්‍රියාවන් සෙවනැල්ල මෙන් ඔහු පසුපසම පැමිණ විපාක ලබාදෙයි.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":842,"category":"justice","english":{"proverb":"What goes around comes around, as experience continually confirms","meaning":"A golden principle: The energies, malice, or benevolence you emit into the world inevitably return to your own doorstep.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"விதைத்தவன் அறுப்பான் வினை விதைத்தவன் வினை அறுப்பான் - அனுபவமே இதை மீண்டும் மீண்டும் மெய்ப்பிக்கிறது","meaning":"பொன்மொழி விளக்கம்: நன்மையை விதைப்பவன் நன்மையையும், பாவம் விதைப்பவன் பேரழிவையும் அறுவடை செய்வான்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"කරන කලට පව් මිහිරිය මී සේ, විඳින කලට දුක් දැඩි වෙයි ගිනි සේ - අත්දැකීමෙන් සනාථ වූ සදාකාලික සත්‍යයකි","meaning":"උතුම් උපදේශය: පව් කරන මොහොතේ එය මී පැණි මෙන් මිහිරි වුවද විපාක විඳින විට ගින්නක් සේ දැවෙයි.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":843,"category":"justice","english":{"proverb":"The mills of God grind slowly, yet they grind exceeding small, which remains true across generations","meaning":"A golden principle: Divine or karmic accountability may take seasons to unfold, but its judgment is thorough and inescapable.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"அரசன் அன்று கொல்வான் தெய்வம் நின்று கொல்லும் - சான்றோர்கள் போற்றிய நற்பாதையாகும்","meaning":"பொன்மொழி விளக்கம்: அரச நீதி உடனடியாகத் தண்டிக்கலாம்; ஆனால் இறை நீதி சற்றே தாமதித்தாலும் ஒருபோதும் தப்பவிடாமல் தண்டிக்கும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"අනුන්ට වළවල් කපන්නා තමාම එහි වැටේ - පරපුරෙන් පරපුරට රැකගත් වටිනා අවවාදයකි","meaning":"උතුම් උපදේශය: අනුන් විනාශ කිරීමට උපාය යොදන නපුරු මිනිසා තමන් විසින්ම සාදාගත් උගුලේ සිරවී විනාශ වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":844,"category":"justice","english":{"proverb":"Justice has long arms, a timeless truth of life","meaning":"A golden principle: Accountability reaches across borders, time, and rank to restore moral equilibrium.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"குற்றம் பார்க்கின் சுற்றம் இல்லை - அறிவுடையோர் என்றும் மறவாத நெறியாகும்","meaning":"பொன்மொழி விளக்கம்: பிறர் செய்யும் சிறு சிறு தவறுகளை மட்டுமே பெரிதுபடுத்தி ஆராய்ந்தால் ஒரு உறவும் நம்முடன் தங்காது.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"ධර්මය රකින්නා ධර්මය විසින්ම රකිනු ලබයි - බුද්ධිමතුන් සැමවිටම අනුගමනය කළ ප්‍රතිපත්තියකි","meaning":"උතුම් උපදේශය: සැමවිටම සාධාරණව හා ධාර්මිකව ජීවත්වන මිනිසාට කිසිදු අනතුරක් නොවීමට සොබාදහම රැකවරණය දෙයි.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":845,"category":"justice","english":{"proverb":"Justice delayed is justice denied, as the wise observe","meaning":"A golden principle: Postponing fair restitution inflicts lingering suffering upon the wronged party.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"தர்மத்தின் வாழ்வுதனை சூது கவ்வும் முடிவில் தர்மமே வெல்லும் - தலைமுறைகள் கடந்த நல்விளக்கமாகும்","meaning":"பொன்மொழி விளக்கம்: சூழ்ச்சிகளும் பொய்களும் தற்காலிகமாக தர்மத்தை மறைக்கலாம்; ஆனால் முடிவில் தர்மமே கம்பீரமாய் வெல்லும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"අයුක්තියට දිගු ආයුෂ නැත - ජීවිතයේ යථාර්ථය පෙන්වාදෙන කැඩපතකි","meaning":"උතුම් උපදේශය: බලහත්කාරයෙන් හෝ වංචාවෙන් තාවකාලික ජයග්‍රහණ ලැබුවද අයුක්තිය ඉක්මනින්ම පරාජය වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":846,"category":"justice","english":{"proverb":"Cheaters never prosper, for actions mirror character","meaning":"A golden principle: Ill-gotten gains acquired through fraudulent deceit carry the seeds of their own inevitable destruction.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"பிறர்க்கு இன்னா செய்யற்க - இது காலத்தால் அழியாத வாழ்வியல் உண்மை","meaning":"பொன்மொழி விளக்கம்: எந்தவொரு உயிர்க்கும் மனதாலோ வாக்காலோ செயலாலோ சிறு தீங்கும் விளைவிக்காமல் வாழ்வதே அறம்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"වපුරන දේම අස්වැන්න ලෙස ලැබේ - මෙය කාලාන්තරයක් තිස්සේ සත්‍යය වූ ධර්මතාවයකි","meaning":"උතුම් උපදේශය: අප අනුන්ට යහපත කළහොත් යහපතද, අයහපත කළහොත් විනාශයද ආපසු හිමිවේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":847,"category":"justice","english":{"proverb":"Crime does not pay, as experience continually confirms","meaning":"A golden principle: Transgressing moral and civic law ultimately exacts a catastrophic price from the perpetrator.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"அறம் வெல்லும் பாவம் தோற்கும் - அனுபவமே இதை மீண்டும் மீண்டும் மெய்ப்பிக்கிறது","meaning":"பொன்மொழி விளக்கம்: உலக வரலாற்றில் எந்தக் காலத்திலும் உண்மை அறவழியே வெற்றி பெற்றுள்ளது; அநீதி மண்ணோடு மண்ணாகும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"යුක්තිය පසඳලීම දේව ගතියකි - අත්දැකීමෙන් සනාථ වූ සදාකාලික සත්‍යයකි","meaning":"උතුම් උපදේශය: දුප්පත් පොහොසත් භේදයකින් තොරව සැමට සාධාරණ නීතිය ක්‍රියාත්මක කිරීම උතුම් මෙහෙවරකි.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය  you will collect. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: தன் வினை தன்னைச் சுடும்","meaning":"ஒருவன் பிறருக்குச் செய்யும் வஞ்சகமும் தீமையும் காலப்போக்கில் அவனையே சுட்டெரித்து அழித்துவிடும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: කළකම් පලදේ","meaning":"මිනිසා කරන හොඳ හෝ නරක ක්‍රියාවන් සෙවනැල්ල මෙන් ඔහු පසුපසම පැමිණ විපාක ලබාදෙයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":862,"category":"justice","english":{"proverb":"In moments of decision: What goes around comes around","meaning":"The energies, malice, or benevolence you emit into the world inevitably return to your own doorstep. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: விதைத்தவன் அறுப்பான் வினை விதைத்தவன் வினை அறுப்பான்","meaning":"நன்மையை விதைப்பவன் நன்மையையும், பாவம் விதைப்பவன் பேரழிவையும் அறுவடை செய்வான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: කරන කලට පව් මිහිරිය මී සේ, විඳින කලට දුක් දැඩි වෙයි ගිනි සේ","meaning":"පව් කරන මොහොතේ එය මී පැණි මෙන් මිහිරි වුවද විපාක විඳින විට ගින්නක් සේ දැවෙයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":863,"category":"justice","english":{"proverb":"Heed the adage: The mills of God grind slowly, yet they grind exceeding small","meaning":"Divine or karmic accountability may take seasons to unfold, but its judgment is thorough and inescapable. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: அரசன் அன்று கொல்வான் தெய்வம் நின்று கொல்லும்","meaning":"அரச நீதி உடனடியாகத் தண்டிக்கலாம்; ஆனால் இறை நீதி சற்றே தாமதித்தாலும் ஒருபோதும் தப்பவிடாமல் தண்டிக்கும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: අනුන්ට වළවල් කපන්නා තමාම එහි වැටේ","meaning":"අනුන් විනාශ කිරීමට උපාය යොදන නපුරු මිනිසා තමන් විසින්ම සාදාගත් උගුලේ සිරවී විනාශ වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":864,"category":"justice","english":{"proverb":"A golden rule: Justice has long arms","meaning":"Accountability reaches across borders, time, and rank to restore moral equilibrium. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: குற்றம் பார்க்கின் சுற்றம் இல்லை","meaning":"பிறர் செய்யும் சிறு சிறு தவறுகளை மட்டுமே பெரிதுபடுத்தி ஆராய்ந்தால் ஒரு உறவும் நம்முடன் தங்காது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: ධර්මය රකින්නා ධර්මය විසින්ම රකිනු ලබයි","meaning":"සැමවිටම සාධාරණව හා ධාර්මිකව ජීවත්වන මිනිසාට කිසිදු අනතුරක් නොවීමට සොබාදහම රැකවරණය දෙයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":865,"category":"justice","english":{"proverb":"Keep in mind that Justice delayed is justice denied","meaning":"Postponing fair restitution inflicts lingering suffering upon the wronged party. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: தர்மத்தின் வாழ்வுதனை சூது கவ்வும் முடிவில் தர்மமே வெல்லும்","meaning":"சூழ்ச்சிகளும் பொய்களும் தற்காலிகமாக தர்மத்தை மறைக்கலாம்; ஆனால் முடிவில் தர்மமே கம்பீரமாய் வெல்லும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: අයුක්තියට දිගු ආයුෂ නැත","meaning":"බලහත්කාරයෙන් හෝ වංචාවෙන් තාවකාලික ජයග්‍රහණ ලැබුවද අයුක්තිය ඉක්මනින්ම පරාජය වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":866,"category":"justice","english":{"proverb":"Remember well: Cheaters never prosper","meaning":"Ill-gotten gains acquired through fraudulent deceit carry the seeds of their own inevitable destruction. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: பிறர்க்கு இன்னா செய்யற்க","meaning":"எந்தவொரு உயிர்க்கும் மனதாலோ வாக்காலோ செயலாலோ சிறு தீங்கும் விளைவிக்காமல் வாழ்வதே அறம். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: වපුරන දේම අස්වැන්න ලෙස ලැබේ","meaning":"අප අනුන්ට යහපත කළහොත් යහපතද, අයහපත කළහොත් විනාශයද ආපසු හිමිවේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":867,"category":"justice","english":{"proverb":"In moments of decision: Crime does not pay","meaning":"Transgressing moral and civic law ultimately exacts a catastrophic price from the perpetrator. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: அறம் வெல்லும் பாவம் தோற்கும்","meaning":"உலக வரலாற்றில் எந்தக் காலத்திலும் உண்மை அறவழியே வெற்றி பெற்றுள்ளது; அநீதி மண்ணோடு மண்ணாகும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: යුක්තිය පසඳලීම දේව ගතියකි","meaning":"දුප්පත් පොහොසත් භේදයකින් තොරව සැමට සාධාරණ නීතිය ක්‍රියාත්මක කිරීම උතුම් මෙහෙවරකි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":868,"category":"justice","english":{"proverb":"Heed the adage: Fair play is a jewel","meaning":"Adhering to scrupulous equity and sportsmanship is a magnificent testament to human nobility. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: அடுத்தவர்க்கு குழி பறிப்பவன் தானே விழுவான்","meaning":"பிறருக்குத் தீங்கு செய்ய சதி செய்பவன், தானே அந்த ஆபத்துப் படுகுழியில் வீழ்ந்து மடிவான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: සොරකම් කළ වස්තුව විනාශය කැඳවයි","meaning":"අනුන්ගේ දේ අයිතිකරගෙන ධනවත් වීමට තැත්කරන මිනිසා මුළු පරම්පරාවටම ශාපයක් උරුම කරගනී. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය goryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":873,"category":"justice","english":{"proverb":"Heed the adage: Two wrongs do not make a right","meaning":"Retaliating against injustice with unlawful malice only compounds the moral tragedy. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: ஊழ்வினை உறுத்து வந்து ஊட்டும்","meaning":"முற்பிறவியிலும் இப்பிறவியிலும் செய்த வினைகளின் பலன்களை யாரும் அனுபவிக்காமல் தப்ப முடியாது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: අවංක මිනිසාට කිසිවෙකුට බියවීමට කරුණක් නැත","meaning":"තමන් කිසිදු වරදක් නොකළේ නම් රජුන් ඉදිරියේ වුවද නිර්භීතව කෙළින් සිටිය හැකිය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":874,"category":"justice","english":{"proverb":"A golden rule: Murder will out","meaning":"Heinous transgressions against life and innocent blood cannot remain shrouded forever. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: நடுவுநிலைமை தவறாதே","meaning":"எந்தச் சூழலிலும் சொந்த விருப்பு வெறுப்புகளுக்கு இடம் கொடாமல் நடுநிலையோடு நீதியை நிலைநாட்ட வேண்டும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: නරක වැඩ අඳුරේ කළද එළිවේ","meaning":"කොතෙක් රහසින් අකුසල් කළද කවදා හෝ දිනක මුළු ලොව ඉදිරියේ එය හෙළිදරව් වේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":875,"category":"justice","english":{"proverb":"Keep in mind that A clear conscience is a soft pillow","meaning":"Freedom from moral wrongdoing grants serene, untroubled slumber that no tyrant can purchase. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: ஏழையின் கண்ணீர் கூரிய வாள்","meaning":"அநீதியால் பாதிக்கப்பட்ட ஏழை எளியோரின் கண்ணீர்த் துளிகள் அக்கிரமக்காரனை அடியோடு சாய்க்கும் வாளாகும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: ධර්මයේ මාවත සදාකාලිකයි","meaning":"මිහිපිට සියලු බලයන් ක්ෂය වී ගියද ධර්මය හා සදාචාරය නොනැසී පවතී. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":876,"category":"justice","english":{"proverb":"Remember well: Evil deeds, like chickens, come home to roost","meaning":"Sinister machinations invariably fly back to roost with their architect. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: அறநெறி முதற்கண் காப்போம்","meaning":"மனித வாழ்வின் அனைத்து நிலைகளிலும் நேர்மையையும் அறநெறியையும் உயிர்மூச்சாகக் காக்க வேண்டும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: සාක්ෂිය ඇත්තේ හදවතේය","meaning":"අන්‍යයන් මුළා කළද තමාගේම හෘදසාක්ෂිය ඉදිරියේ කිසිවෙකුට බොරු කළ නොහැකිය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":877,"category":"justice","english":{"proverb":"In moments of decision: Do not judge, or you too will be judged","meaning":"Those who hastily dispense harsh condemnation will find themselves measured by identical scrutiny. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: செய்த பாவம் சும்மா விடாது","meaning":"மறைமுகமாகச் செய்த பாவங்கள் கூட நிழல் போலத் தொடர்ந்து வந்து தக்க தண்டனையைத் தரும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: සත්‍යයේ මාවතේ ගමන් කරන්න","meaning":"කොතෙක් බාධක පැමිණියද අයුක්තියට හිස නොනමා සත්‍යය වෙනුවෙන් පෙනීසිටීම වීරකමකි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":878,"category":"justice","english":{"proverb":"Heed the adage: An eye for an eye will leave the whole world blind","meaning":"Unchecked cycles of vindictive vengeance consume society in complete darkness. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: பொய்மைக்கு ஆயுள் குறைவு","meaning":"அநீதியும் ஏமாற்று வேலைகளும் குறுகிய கால வெற்றி பெற்றாலும் விரைவில் மாயமாய் மறைந்துவிடும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: වරදට දඬුවම නිරායාසයෙන් ලැබේ","meaning":"ස්වභාවධර්මයේ නීතිය කිසිවෙකුටත් විශේෂත්වයක් නොදක්වා වැරදි කළ අයට සුදුසු දඬුවම් පමුණුවයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":879,"category":"justice","english":{"proverb":"A golden rule: Innocent until proven guilty","meaning":"Preserving the sanctity of fairness demands rigorous proof before passing sentence. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: அன்போடு கூடிய நீதியே தெய்வீகம்","meaning":"கடுமையான பழிவாங்கலாக இல்லாமல் கருணையோடு கூடிய நீதியை வழங்குவதே மேலான பண்பு. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: අනුන්ගේ අයිතිවාසිකම්වලට ගරුකරන්න","meaning":"තමන්ගේ නිදහස භුක්ති විඳින අතරම අන් අයගේ අයිතීන්ට හානියක් නොකිරීමට වගබලාගත යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"කර්මය සහ සාධාරණත්වය","tags":["කර්මය සහ සාධාරණත්වය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":880,"category":"justice","english":{"proverb":"Keep in mind that Right is right, even if no one is doing it","meaning":"Moral rectitude remains supreme regardless of prevailing public corruption or indifference. Cultivating this understanding brings harmony and resilience.","categoryName":"Justice & Karma","tags":["Justice & Karma","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: மண் ஆசை கொண்டவன் அழிவான்","meaning":"பிறர் நிலத்தையும் உரிமையையும் அநியாயமாகப் பறிக்க நினைப்பவன் முடிவில் மண்ணோடு கலப்பான். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"நீதியும் அறமும்","tags":["நீதியும் அறமும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: සාමකාමී විසඳුම උසස්ය","meaning":"ගැටුම් හා ආරවුල් මගින් නොව සාකච්ඡාවෙන් හා යුක්තියෙන් ප්‍රශ්න නිරාකරණය කරගැනීම ශ්‍රේෂ්ඨය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍ ]},"sinhala":{"proverb":"පරිසරය රැකීම අප රැකීමයි - බුද්ධිමතුන් සැමවිටම අනුගමනය කළ ප්‍රතිපත්තියකි","meaning":"උතුම් උපදේශය: ගස් කොළන්, ඇළ දොළ හා සතා සීපාවාට ආදරය කිරීමෙන් අපගේ පැවැත්මද තහවුරු වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":960,"category":"nature","english":{"proverb":"Time and season for all things under heaven, as the wise observe","meaning":"A golden principle: Life moves through deliberate cyclical seasons of planting, pruning, and bountiful harvest.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"இயற்கையை மதித்து வாழ்வோம் - தலைமுறைகள் கடந்த நல்விளக்கமாகும்","meaning":"பொன்மொழி விளக்கம்: நமக்கு வாழ்வளிக்கும் பஞ்சபூதங்களையும் மரம் செடி கொடிகளையும் பாதுகாத்து வாழ்வதே மனித குலத்தின் கடமை.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"ජීවිතය ගලායන ගංගාවක් බඳුය - ජීවිතයේ යථාර්ථය පෙන්වාදෙන කැඩපතකි","meaning":"උතුම් උපදේශය: අතීතය අල්ලාගෙන නොසිට ගලායන ගඟක් සේ අලුත් අත්දැකීම්වලට විවෘතව ජීවත් විය යුතුය.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":961,"category":"nature","english":{"proverb":"Remember well: Every cloud has a silver lining","meaning":"Even the darkest, most desolate circumstances harbor seeds of hope and unexpected grace. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: நிழலின் அருமை வெயிலில் தெரியும்","meaning":"கொளுத்தும் வெயிலில் அலைந்த பின்னரே மர நிழலின் சுகமும் அருமையும் மனிதனுக்கு முழுமையாகப் புரியும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: මුහුණ සඟවාගත නොහැක","meaning":"ස්වභාවධර්මයේ නීතිය මෙන්ම මිනිසාගේ සැබෑ ස්වභාවයද කිසිදා සදහටම සඟවා තැබිය නොහැක. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":962,"category":"nature","english":{"proverb":"In moments of decision: You cannot judge a book by its cover","meaning":"External appearances frequently belie the true character, complexity, and worth inside. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: காகத்திற்கும் தன் குஞ்சு பொன் குஞ்சு","meaning":"உலகிற்கு சாதாரணமாகத் தோன்றினாலும் பெற்றோருக்குத் தனது குழந்தை எப்போதும் விலைமதிப்பற்ற பொக்கிஷமே. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"තීරණාත්මක මොහොතකදී: කපුටාටත් තම පැටියා රත්තරන්ය","meaning":"බාහිර ලෝකයට කෙසේ පෙනුණද සෑම දෙමව්පියෙකුටම තම දරුවා ලොව ඇති උතුම්ම සම්පතයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":963,"category":"nature","english":{"proverb":"Heed the adage: The grass is always greener on the other side","meaning":"People habitually misjudge other people's circumstances as far superior to their own reality. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"வழிகாட்டும் பொன்நெறி: ஆலும் வேலும் பல்லுக்குறுதி நாலும் இரண்டும் சொல்லுக்குறுதி","meaning":"இயற்கைத் தாவரங்கள் உடலுக்கு பலம் தருவது போல, நாலடியாரும் திருக்குறளும் நாவிற்குத் தெளிவான விவேகத்தைத் தரும். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මගපෙන්වන ආදර්ශය: නටන්න බැරි මිනිහා පොළොව ඇදයි කිව්වාලු","meaning":"තමන්ගේ නොහැකියාව හා අදක්ෂකම වසාගැනීමට බාහිර පරිසරයට හා අනුන්ට දොස් පැවරීම. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":964,"category":"nature","english":{"proverb":"A golden rule: After the storm comes the calm","meaning":"The most turbulent and destructive crises eventually yield to peaceful, luminous quietude. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"என்றும் காக்க வேண்டியது: ஊமை கண்ட கனவு போல்","meaning":"சில ஆழமான உணர்வுகளையும் மெய்ஞ்ஞான அனுபவங்களையும் வார்த்தைகளால் விவரித்துவிட முடியாது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: ගහේ මල පිපෙන්නේ නියමිත කාලයටයි","meaning":"ස්වභාවධර්මයේ සෑම දෙයකටම නියමිත රිද්මයක් ඇති බැවින් අනවශ්‍ය කලබලයෙන් කිසිවක් කළ නොහැක. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":965,"category":"nature","english":{"proverb":"Keep in mind that Deep rivers move with silent majesty","meaning":"Profound competence, genuine strength, and true depth move without frantic noise. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: அத்தி பூத்தாற்போல","meaning":"மிகவும் அபூர்வமாக அரிதாக நடக்கும் அற்புத நிகழ்வுகளைக் குறிக்கும் உவமை. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: ළිං මැඩියාට ලෝකය කුඩාය","meaning":"විශාල ලෝකය ගැන කිසිවක් නොදැන තමාගේ කුඩා සීමාව තුළ පමණක් සිත සිරකර නොගත යුතුය. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":966,"category":"nature","english":{"proverb":"Remember well: No garden is without its weeds","meaning":"Every noble human enterprise inevitably carries small imperfections that require vigilant tending. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"நினைவில் நிறுத்துக: தண்ணீர் வெந்நீரானாலும் நெருப்பை அணைக்கும்","meaning":"இயல்பு மாறினாலும் எளியவர்க்கும் ஆபத்தான தீமைகளைத் தடுத்து அழிக்கும் சக்தி எப்போதும் உண்டு. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"මතක තබාගත යුතු කරුණ: කොක්කාට වාරයක් එනතුරු තිත්තයා ඉවසිය යුතුය","meaning":"දුර්වලයන්ට පීඩා කරන අයටද ස්වභාවධර්මය විසින් විපාක දෙන මොහොතක් උදාවේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":967,"category":"nature","english":{"proverb":"In moments of decision: A bird in the hand is worth two in the bush","meaning":"A modest, guaranteed asset right now surpasses risky, elusive speculations. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"வாழ்வின் திருப்புமுனையில்: மரத்தை வைத்தவன் தண்ணீர் ஊற்றுவான்","meaning":"இவ்வுலகில் நம்மைப் படைத்த இயற்கை அன்னை நமக்கான வாழ்வாதாரத்தையும் உரிய ந meaning":"எதிர்பாராமல் தானாக நடந்த ஒரு நிகழ்வுக்குத் தன் செயலே காரணம் என்று தற்பெருமை பேசக் கூடாது. இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නිරතුරුවම සිහිපත් කළ යුත්තේ: කැලේ මාරු වුවද කොටියාගේ පුල්ලි මාරු නොවේ","meaning":"බාහිර පරිසරය වෙනස් කළද පුද්ගලයෙකුගේ මුල් ස්වභාවය පහසුවෙන් වෙනස් නොවේ. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":970,"category":"nature","english":{"proverb":"Keep in mind that Like water off a duck's back","meaning":"Refusing to allow malicious criticisms or insults to pierce your tranquil spirit. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"கடைப்பிடிக்க வேண்டிய விவேகம்: இலை மறை காயாக","meaning":"சிறந்த அறிஞர்களும் நற்பண்புகளும் ஆரவாரமின்றி எளிமையின் பின்னணியில் ஒளிந்திருப்பார்கள். இந்த விவேகத்தைக் கடைப்பிடிப்பது வாழ்வில் அமைதியையும் தெளிவையும் தரும்.","categoryName":"இயற்கையும் வாழ்வியலும்","tags":["இயற்கையும் வாழ்வியலும்","பழமொழி","வாழ்வியல்"]},"sinhala":{"proverb":"නුවණින් ක්‍රියාකිරීමට නම්: ඉර හඳ මෙන් සත්‍යයද බබළයි","meaning":"ලෝකයේ කිසිදා සඟවා තැබිය නොහැකි දේවල් තුනකි: හිරු, සඳු සහ සත්‍යයයි. මෙම අවබෝධය ප්‍රායෝගිකව ක්‍රියාත්මක කිරීමෙන් ජීවිතය වඩාත් අර්ථවත් වේ.","categoryName":"සොබාදහම සහ ජීවිතය","tags":["සොබාදහම සහ ජීවිතය","ප්‍රස්ථාව පිරුළු","ජනශ්‍රැතිය"]}},{"id":971,"category":"nature","english":{"proverb":"Remember well: The sun shines on the good and the bad alike","meaning":"Nature dispenses its magnificent life-giving bounty with universal, non-judgmental grace. Cultivating this understanding brings harmony and resilience.","categoryName":"Nature & Life Lessons","tags":["Nature & Life Lessons","Adage","Wisdom"]},"tamil":{"proverb":"நினைவ
